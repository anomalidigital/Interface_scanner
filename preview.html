<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Preview · Interface scanner</title>

    <!--
      HALAMAN INI HANYA UNTUK MENCOBA SCAN.html DI BROWSER BIASA.
      Jangan diunggah ke platform.

      SCAN.html isinya potongan Angular (gaya + main + skrip) yang di
      platform ditempel ke dalam komponen. Supaya bisa dibuka sendiri,
      halaman ini (sama dengan preview.html di template Gemini):
        1. mengambil ketiga bagian itu dari berkasnya,
        2. menerjemahkan sintaks template Angular ke Vue
           (*ngIf -> v-if, [x] -> :x, (klik) -> @klik, dst),
        3. menjalankan skripnya dengan `this` = state Vue yang reaktif,
           lengkap dengan tiruan zone / activatedRoute.

      Jalankan lewat server lokal (fetch tidak bisa dari file://):
        python -m http.server 5173   lalu buka http://localhost:5173/preview.html

      Query yang berguna:
        ?fake=test/kartu-meja-kayu.jpg   kamera tiruan dari sebuah foto
                                         (untuk laptop tanpa kamera / pengujian)
        &shake=2                         besar goyangan tangan tiruan (px)
        &walk                            kertas keluar-masuk frame tiap 10 detik
        ?IsUpload                        tombol "Unggah foto" di layar kamera
        ?noworker                        uji jalur cadangan: deteksi di thread utama
    -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }

      #preview-error {
        display: none;
        padding: 24px;
        color: #ffb4b4;
        font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <pre id="preview-error"></pre>

    <script>
      (async () => {
        const PAGE = "SCAN.html";

        const fail = (msg) => {
          const el = document.getElementById("preview-error");
          el.style.display = "block";
          el.textContent = String(msg);
          console.error(msg);
        };

        /* Kamera tiruan: foto digambar ke kanvas dengan goyangan kecil seperti
           dipegang tangan, lalu dijadikan stream lewat captureStream(). */
        const installFakeCamera = async (q) => {
          const img = new Image();
          img.src = q.fake;
          await img.decode();
          const W = 1280;
          const H = Math.round((W * img.naturalHeight) / img.naturalWidth);
          const canvas = document.createElement("canvas");
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext("2d");
          const amp = Number(q.shake ?? 2);
          const walk = "walk" in q;
          const t0 = performance.now();
          const draw = () => {
            const t = (performance.now() - t0) / 1000;
            let dx = Math.sin(t * 1.7) * amp + Math.sin(t * 4.3) * amp * 0.35;
            const dy = Math.cos(t * 1.3) * amp * 0.8;
            if (walk) {
              const phase = (t % 10) / 10;
              if (phase > 0.72) dx += ((phase - 0.72) / 0.28) * W;
            }
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.translate(W / 2 + dx, H / 2 + dy);
            ctx.rotate(Math.sin(t * 0.8) * 0.0025 * amp);
            ctx.drawImage(img, (-W / 2) * 1.03, (-H / 2) * 1.03, W * 1.03, H * 1.03);
            ctx.restore();
          };
          draw();
          setInterval(draw, 33);
          const md = navigator.mediaDevices;
          md.getUserMedia = async () => canvas.captureStream(30);
          md.enumerateDevices = async () => [{ kind: "videoinput", deviceId: "fake-1", label: "Kamera tiruan", groupId: "" }];
        };

        try {
          const raw = await fetch(PAGE, { cache: "no-cache" }).then((r) => r.text());

          // dijangkarkan ke awal baris supaya tidak ikut kena tulisan nama
          // tag yang kebetulan ada di dalam komentar
          const styleSrc = raw.match(/^<style>\r?\n([\s\S]*?)^<\/style>/m)[1];
          const mainSrc = raw.match(/^<main[\s\S]*?^<\/main>/m)[0];
          const scriptSrc = raw.match(/^<script>\r?\n([\s\S]*?)^<\/script>/m)[1];

          document.head.appendChild(Object.assign(document.createElement("style"), { textContent: styleSrc }));

          // --- Angular -> Vue (urutannya penting: yang khusus dulu) ---
          const template = mainSrc
            .replace(/\*ngIf="/g, 'v-if="')
            .replace(/\*ngFor="let\s+(\w+)\s+of\s+([^";]+);\s*let\s+(\w+)\s*=\s*index\s*"/g, 'v-for="($1, $3) in $2"')
            .replace(/\*ngFor="let\s+(\w+)\s+of\s+([^"]+)"/g, 'v-for="$1 in $2"')
            .replace(/<ng-container/g, "<template")
            .replace(/<\/ng-container>/g, "</template>")
            .replace(/\[ngClass\]="/g, ':class="')
            .replace(/\[ngStyle\]="/g, ':style="')
            .replace(/\[attr\.([\w-]+)\]="/g, ':$1="')
            .replace(/\[([\w.-]+)\]="/g, ':$1="')
            .replace(/\(keyup\.enter\)="/g, '@keyup.enter="')
            .replace(/\((\w[\w-]*)\)="/g, '@$1="');

          const queryParams = Object.fromEntries(new URLSearchParams(location.search));
          if (queryParams.fake) await installFakeCamera(queryParams);
          if ("noworker" in queryParams) window.Worker = undefined;

          // --- state + tiruan lingkungan Angular ---
          const state = Vue.reactive({});
          state.zone = { run: (fn) => fn() };
          state.activatedRoute = { snapshot: { params: { code: "GANTI-KODE-PROYEK" }, queryParams } };

          new Function(scriptSrc).call(state);
          window.__state = state;

          Vue.createApp({ setup: () => state, template }).mount("#app");
        } catch (error) {
          fail(error?.stack ?? error);
        }
      })();
    </script>
  </body>
</html>
