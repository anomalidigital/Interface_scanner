<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap");

/* ==========================================================================
   INTERFACE SCANNER — gaya

   Bootstrap 5.3 (sudah dimuat platform) dipakai untuk tombol, grup tombol,
   dan utilitas jarak/flex. Aturan di bawah ini hanya untuk yang memang tidak
   ada di Bootstrap: kamera layar penuh, kontrol yang melayang di atas
   gambar, tombol jepret, dan permukaan kaca.

   Semua class diawali "scn-" supaya tidak bentrok dengan tema platform.

   Efek cahaya scan TIDAK ada di sini. Semuanya digambar WebGL di kanvas
   (region "Lapisan cahaya" di skrip), karena animasi CSS @keyframes dan
   [ngStyle] di dalam layar *ngIf terbukti diam di platform ini (lihat
   catatan template Gemini).
   ========================================================================== */

.scn-host {
  --scn-ink: #000;
  --scn-paper: #fff;
  --scn-mist: rgba(255, 255, 255, 0.72);
  --scn-glass: rgba(22, 22, 26, 0.48);
  --scn-line: rgba(255, 255, 255, 0.16);
  --scn-accent: #ed4835;
  --scn-font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --scn-safe-t: env(safe-area-inset-top, 0px);
  --scn-safe-r: env(safe-area-inset-right, 0px);
  --scn-safe-b: env(safe-area-inset-bottom, 0px);
  --scn-safe-l: env(safe-area-inset-left, 0px);

  position: fixed;
  inset: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--scn-ink);
  color: var(--scn-paper);
  font-family: var(--scn-font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Kiosk tidak boleh bisa digulir: sisa halaman platform (nav / footer) tidak
   boleh menambah tinggi dokumen. */
html,
body {
  overflow: hidden !important;
  overscroll-behavior: none;
  background: #000;
}

.scn-host *,
.scn-host *::before,
.scn-host *::after {
  box-sizing: border-box;
}

/* :where() supaya reset ini ber-specificity nol dan tidak mengalahkan
   aturan satu class di bawahnya. */
.scn-host :where(h1, h2, p) {
  margin: 0;
}

.scn-host :where(button, input, label) {
  font-family: inherit;
}

.scn-host :focus-visible,
.scn-host .btn:focus-visible {
  outline: 2px solid var(--scn-accent);
  outline-offset: 3px;
  box-shadow: none;
}

/* --------------------------------------------------------------------------
   Kerangka layar
   -------------------------------------------------------------------------- */
.scn-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.scn-bar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-height: 3.5rem;
  padding: calc(0.5rem + var(--scn-safe-t)) max(1rem, var(--scn-safe-r)) 0.5rem max(1rem, var(--scn-safe-l));
}

.scn-title {
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.scn-sub {
  max-width: 46ch;
  color: var(--scn-mist);
  font-size: 0.875rem;
  line-height: 1.5;
}

/* --------------------------------------------------------------------------
   Kamera — layar penuh. Video mengisi seluruh layar (cover), judul dan
   kontrol melayang di atasnya dengan bayangan gradasi supaya tetap terbaca.
   -------------------------------------------------------------------------- */
.scn-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #000;
  isolation: isolate;
}

.scn-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.scn-state {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  padding: 2rem;
  text-align: center;
}

.scn-state p {
  max-width: 34ch;
  color: var(--scn-mist);
  font-size: 0.9375rem;
  line-height: 1.55;
}

.scn-controls {
  position: absolute;
  z-index: 3;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  padding: 3.5rem max(1.25rem, var(--scn-safe-r)) calc(1.5rem + var(--scn-safe-b)) max(1.25rem, var(--scn-safe-l));
  background: linear-gradient(to top, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0));
  pointer-events: none;
}

.scn-controls > * {
  pointer-events: auto;
}

.scn-controls__row {
  display: grid;
  grid-template-columns: 1fr minmax(0, auto) 1fr;
  align-items: center;
  gap: 0.75rem;
  width: min(100%, 36rem);
}

.scn-side {
  display: flex;
  align-items: center;
  min-width: 2.75rem;
}

.scn-side--end {
  justify-content: flex-end;
}

/* Ajakan di bawah selama kamera membaca */
.scn-prompt {
  max-width: 17rem;
  color: var(--scn-paper);
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.005em;
  text-align: center;
  text-wrap: balance;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
}

/* Loading sesudah scan berhasil: menggantikan ajakan di tempat yang sama.
   Lingkaran putarnya dibangun dan digerakkan JS (region "Berhasil scan"). */
.scn-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.625rem;
  min-height: 2.75rem;
  color: var(--scn-paper);
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.005em;
  white-space: nowrap;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
}

.scn-spinner {
  flex: none;
  display: block;
  width: 1.375rem;
  height: 1.375rem;
}

.scn-spinner svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* --------------------------------------------------------------------------
   Tutorial — animasi garis tanpa teks di atas kamera. Latarnya diredupkan dan
   diburamkan supaya mata langsung ke animasinya. Gambarnya dibangun JS
   (region "Tutorial"), bukan ditulis di markup. "Lewati" ada tepat di bawah
   animasinya, rata kanan.
   -------------------------------------------------------------------------- */
.scn-tut {
  position: absolute;
  z-index: 10;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(2rem + var(--scn-safe-t)) 1rem calc(2rem + var(--scn-safe-b));
  background: rgba(0, 0, 0, 0.76);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}

.scn-tut__box {
  display: flex;
  flex-direction: column;
  width: min(92vw, 30rem, calc((100vh - 8rem) * 1000 / 1260));
  width: min(92vw, 30rem, calc((100dvh - 8rem) * 1000 / 1260));
}

.scn-tut__art {
  width: 100%;
  aspect-ratio: 1000 / 1260;
}

.scn-tut__art svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.scn-tut__foot {
  display: flex;
  justify-content: flex-end;
  margin-top: 1.25rem;
}

.scn-host .btn.scn-tut__skip {
  --bs-btn-padding-x: 1.4rem;
  --bs-btn-padding-y: 0.6rem;
  --bs-btn-font-size: 0.9375rem;
  --bs-btn-font-weight: 600;
}

/* --------------------------------------------------------------------------
   Tombol: Bootstrap .btn, warnanya diatur lewat variabel --bs-btn-*
   -------------------------------------------------------------------------- */
.scn-host .btn.scn-glass {
  --bs-btn-color: var(--scn-paper);
  --bs-btn-bg: var(--scn-glass);
  --bs-btn-border-color: var(--scn-line);
  --bs-btn-hover-color: var(--scn-paper);
  --bs-btn-hover-bg: rgba(255, 255, 255, 0.14);
  --bs-btn-hover-border-color: rgba(255, 255, 255, 0.22);
  --bs-btn-active-color: var(--scn-paper);
  --bs-btn-active-bg: rgba(255, 255, 255, 0.2);
  --bs-btn-active-border-color: rgba(255, 255, 255, 0.28);
  --bs-btn-disabled-color: var(--scn-paper);
  --bs-btn-disabled-bg: var(--scn-glass);
  --bs-btn-disabled-border-color: var(--scn-line);
  --bs-btn-padding-x: 1rem;
  --bs-btn-padding-y: 0.55rem;
  --bs-btn-font-size: 0.875rem;
  --bs-btn-font-weight: 500;
  --bs-btn-border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  white-space: nowrap;
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  backdrop-filter: blur(16px) saturate(150%);
}

.scn-host .btn.scn-solid {
  --bs-btn-color: #000;
  --bs-btn-bg: var(--scn-paper);
  --bs-btn-border-color: var(--scn-paper);
  --bs-btn-hover-color: #000;
  --bs-btn-hover-bg: #e8e8ee;
  --bs-btn-hover-border-color: #e8e8ee;
  --bs-btn-active-color: #000;
  --bs-btn-active-bg: #d9d9e2;
  --bs-btn-active-border-color: #d9d9e2;
  --bs-btn-disabled-color: #000;
  --bs-btn-disabled-bg: var(--scn-paper);
  --bs-btn-disabled-border-color: var(--scn-paper);
  --bs-btn-disabled-opacity: 0.45;
  --bs-btn-padding-x: 1.25rem;
  --bs-btn-padding-y: 0.8rem;
  --bs-btn-font-size: 0.9375rem;
  --bs-btn-font-weight: 600;
  --bs-btn-border-radius: 999px;
  white-space: nowrap;
}

.scn-host .btn.scn-lg {
  --bs-btn-padding-x: 1.25rem;
  --bs-btn-padding-y: 0.8rem;
  --bs-btn-font-size: 0.9375rem;
}

.scn-host .btn.scn-round {
  --bs-btn-padding-x: 0;
  --bs-btn-padding-y: 0;
  width: 2.75rem;
  height: 2.75rem;
}

.scn-host .btn.scn-round.is-on {
  --bs-btn-color: #000;
  --bs-btn-bg: var(--scn-paper);
  --bs-btn-hover-color: #000;
  --bs-btn-hover-bg: #e8e8ee;
}

.scn-icon {
  flex: none;
  width: 1.125rem;
  height: 1.125rem;
}

/* --------------------------------------------------------------------------
   Hasil & atur sudut (keduanya: area gambar + panel)
   -------------------------------------------------------------------------- */
.scn-split {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.scn-view {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 1.25rem 1rem;
}

.scn-sheet {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  border-radius: 2px;
  background: #fff;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 1.5rem 3.5rem -1rem rgba(0, 0, 0, 0.9);
  transition: opacity 0.2s ease;
}

.scn-sheet.is-busy {
  opacity: 0.45;
}

.scn-editor {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 1rem;
  overflow: hidden;
}

.scn-panel {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 0.25rem max(1.25rem, var(--scn-safe-r)) calc(1.25rem + var(--scn-safe-b)) max(1.25rem, var(--scn-safe-l));
}

.scn-host .scn-segment {
  display: flex;
  width: 100%;
  padding: 0.25rem;
  border: 1px solid var(--scn-line);
  border-radius: 999px;
  background: var(--scn-glass);
}

.scn-host .scn-segment > .btn {
  --bs-btn-color: var(--scn-mist);
  --bs-btn-bg: transparent;
  --bs-btn-border-color: transparent;
  --bs-btn-hover-color: var(--scn-paper);
  --bs-btn-hover-bg: transparent;
  --bs-btn-hover-border-color: transparent;
  --bs-btn-active-color: #000;
  --bs-btn-active-bg: var(--scn-paper);
  --bs-btn-active-border-color: var(--scn-paper);
  --bs-btn-padding-x: 0.5rem;
  --bs-btn-padding-y: 0.5rem;
  --bs-btn-font-size: 0.875rem;
  --bs-btn-font-weight: 500;
  flex: 1 1 0;
  margin: 0;
  border-radius: 999px !important;
  white-space: nowrap;
}

.scn-toast {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: calc(7rem + var(--scn-safe-b));
  transform: translateX(-50%);
  padding: 0.55rem 1.1rem;
  border-radius: 999px;
  background: var(--scn-paper);
  color: #000;
  font-size: 0.875rem;
  font-weight: 500;
  box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.5);
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   Tablet & desktop
   -------------------------------------------------------------------------- */
@media (min-width: 768px) {
  .scn-bar {
    min-height: 4rem;
    padding-left: max(1.75rem, var(--scn-safe-l));
    padding-right: max(1.75rem, var(--scn-safe-r));
  }

  .scn-title {
    font-size: 1.125rem;
  }

  .scn-controls {
    padding-bottom: calc(1.75rem + var(--scn-safe-b));
  }

  .scn-view {
    padding: 1rem 2rem 1.5rem;
  }

  .scn-panel {
    width: min(100%, 30rem);
    margin: 0 auto;
  }
}

@media (min-width: 992px) {
  .scn-split {
    flex-direction: row;
    width: min(100%, 72rem);
    margin: 0 auto;
  }

  .scn-view {
    padding: 1.5rem 1rem 2.5rem 2.5rem;
  }

  .scn-panel {
    width: 22rem;
    margin: 0;
    justify-content: center;
    padding: 1.5rem max(2.5rem, var(--scn-safe-r)) 2.5rem 1.5rem;
  }
}

/* --------------------------------------------------------------------------
   Ponsel miring (layar pendek): tutorial dan kontrol dirapatkan
   -------------------------------------------------------------------------- */
@media (orientation: landscape) and (max-height: 540px) {
  .scn-bar {
    min-height: 2.75rem;
    padding-top: calc(0.25rem + var(--scn-safe-t));
    padding-bottom: 0.25rem;
  }

  .scn-title {
    font-size: 1rem;
  }

  .scn-controls {
    padding-top: 2.5rem;
    padding-bottom: calc(0.75rem + var(--scn-safe-b));
  }

  .scn-tut {
    padding: calc(0.75rem + var(--scn-safe-t)) 6rem calc(0.75rem + var(--scn-safe-b));
  }

  .scn-tut__box {
    width: min(80vw, 30rem, calc((100vh - 4.5rem) * 1000 / 1260));
    width: min(80vw, 30rem, calc((100dvh - 4.5rem) * 1000 / 1260));
  }

  .scn-tut__foot {
    margin-top: 0.5rem;
  }

  .scn-split {
    flex-direction: row;
  }

  .scn-view {
    padding: 0.25rem 0.75rem 0.75rem max(0.75rem, var(--scn-safe-l));
  }

  .scn-panel {
    width: 17.5rem;
    margin: 0;
    justify-content: center;
    padding: 0.25rem max(1rem, var(--scn-safe-r)) calc(0.75rem + var(--scn-safe-b)) 0.5rem;
  }

  .scn-host .scn-segment > .btn {
    --bs-btn-font-size: 0.8125rem;
  }

  .scn-toast {
    bottom: calc(1.25rem + var(--scn-safe-b));
  }
}

@media (prefers-reduced-motion: reduce) {
  .scn-sheet {
    transition: none;
  }
}
</style>

<main class="scn-host" data-bs-theme="dark">
  <!-- ==========================================================
       LAYAR 1 · KAMERA (layar penuh)
       Video mengisi seluruh layar; ajakan dan tombol "?" melayang di
       atasnya. Tidak ada tombol jepret: begitu kartu terbaca dan diam
       sebentar, gambar kamera membeku dan loading muncul di bawah.
       Cahaya scan digambar WebGL di kanvas .scn-layer yang disisipkan JS
       ke #scnStage, bukan ditulis di markup ini.
       ========================================================== -->
  <section class="scn-screen scn-camera" *ngIf="screen === 'camera'">
    <div class="scn-stage" id="scnStage">
      <video id="scnVideo" class="scn-video" autoplay playsinline muted></video>

      <div class="scn-state" *ngIf="cameraState === 'error'">
        <p>{{ cameraMessage }}</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <button type="button" class="btn scn-solid" (click)="retryCamera()">{{ labels.tryAgain }}</button>
          <label class="btn scn-glass scn-lg mb-0">
            <input type="file" accept="image/*" class="d-none" (change)="onUpload($event)" />
            {{ labels.upload }}
          </label>
        </div>
      </div>
    </div>

    <footer class="scn-controls">
      <div class="scn-controls__row">
        <div class="scn-side">
          <!-- Hanya muncul dengan query ?IsUpload, sama seperti halaman Gemini. -->
          <label class="btn scn-glass mb-0" *ngIf="isEnableUpload && cameraState !== 'error'">
            <input type="file" accept="image/*" class="d-none" (change)="onUpload($event)" />
            <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4" /><path d="m7 9 5-5 5 5" /><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" /></svg>
            <span>{{ labels.upload }}</span>
          </label>
        </div>

        <p class="scn-prompt" *ngIf="cameraState !== 'error' && !loading">{{ copy.prompt }}</p>

        <!-- Loading sesudah scan berhasil; lingkarannya diisi JS ke #scnSpinner -->
        <div class="scn-loading" *ngIf="loading" role="status" aria-live="polite">
          <span class="scn-spinner" id="scnSpinner" aria-hidden="true"></span>
          <span>{{ copy.loading }}</span>
        </div>

        <div class="scn-side scn-side--end">
          <!-- Membuka lagi tutorial -->
          <button type="button" class="btn scn-glass scn-round" *ngIf="!loading" [attr.aria-label]="labels.help" (click)="openTutorial()">
            <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 2-2.8 2.4-2.8 4.4" /><path d="M12 18.4h.01" /></svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- TUTORIAL — animasi garis tanpa teks, berulang sampai "Lewati".
         Gambarnya dibangun JS ke dalam #scnTutorial (region "Tutorial"). -->
    <div class="scn-tut" *ngIf="tutorialOpen" role="dialog" aria-modal="true" [attr.aria-label]="labels.help">
      <div class="scn-tut__box">
        <div class="scn-tut__art" id="scnTutorial"></div>
        <div class="scn-tut__foot">
          <button type="button" class="btn scn-glass scn-tut__skip" (click)="closeTutorial()">{{ labels.skip }}</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==========================================================
       LAYAR 2 · HASIL
       Gambarnya membatasi diri sendiri (max-width / max-height),
       jadi kertas rasio apa pun tampil pas tanpa pita kosong.
       ========================================================== -->
  <section class="scn-screen scn-result" *ngIf="screen === 'result'">
    <header class="scn-bar">
      <h1 class="scn-title">{{ copy.resultTitle }}</h1>
    </header>

    <div class="scn-split">
      <div class="scn-view">
        <img id="scnResultImg" class="scn-sheet" *ngIf="resultUrl" [ngClass]="{ 'invisible': revealing, 'is-busy': isBusy && !revealing }" [src]="resultUrl" alt="Hasil scan" />
      </div>

      <div class="scn-panel">
        <div class="btn-group scn-segment" role="group" [attr.aria-label]="labels.filterGroup">
          <button type="button" class="btn" *ngFor="let item of filters" [ngClass]="{ 'active': filter === item.key }" [attr.aria-pressed]="filter === item.key" (click)="setFilter(item.key)">{{ item.label }}</button>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn scn-glass flex-fill" [disabled]="isBusy" (click)="rotate()">
            <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20 4v5h-5" /></svg>
            {{ labels.rotate }}
          </button>
          <button type="button" class="btn scn-glass flex-fill" *ngIf="canAdjust" [disabled]="isBusy" (click)="openAdjust()">
            <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4" /><path d="M15 4h4a1 1 0 0 1 1 1v4" /><path d="M20 15v4a1 1 0 0 1-1 1h-4" /><path d="M9 20H5a1 1 0 0 1-1-1v-4" /></svg>
            {{ labels.adjust }}
          </button>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn scn-glass scn-lg flex-fill" (click)="rescan()">{{ labels.rescan }}</button>
          <button type="button" class="btn scn-solid flex-fill" [disabled]="isBusy || !resultUrl" (click)="save()">{{ labels.save }}</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==========================================================
       LAYAR 3 · ATUR SUDUT
       Editor sudut (titik geser + kaca pembesar) dibuat scanic ke
       dalam #scnEditor sesudah layar ini tampil.
       ========================================================== -->
  <section class="scn-screen scn-adjust" *ngIf="screen === 'adjust'">
    <header class="scn-bar flex-column align-items-start justify-content-center gap-1">
      <h1 class="scn-title">{{ copy.adjustTitle }}</h1>
      <p class="scn-sub">{{ copy.adjustHint }}</p>
    </header>

    <div class="scn-split">
      <div class="scn-view">

<script>
/* =========================================================================
   INTERFACE SCANNER — skrip halaman

   Alur layar:  camera -> result   (result -> adjust -> result)
   SEMENTARA: tanpa tombol jepret (CAPTURE_ENABLED) — tahap ini fokus ke
   tutorial, animasi scan (motion "proyeksi"), dan momen "berhasil scan":
   gambar kamera membeku dan loading sederhana tampil di bawah.

   Deteksi kertas memakai scanic (MIT), dimuat saat halaman dibuka lewat
   import() dari jsDelivr, jadi tidak perlu build atau berkas tambahan.
   Detektor utamanya ML (DocCornerNet, sekitar 2 MB, dimuat sekali). Kalau
   gagal dimuat, otomatis turun ke detektor klasik; kalau scanic sendiri
   gagal dimuat, halaman tetap jalan sebagai kamera biasa.

   Perspektif diluruskan oleh kode di berkas ini sendiri (homografi +
   bilinear), termasuk tebakan rasio asli kertas dari sudut pandang kamera
   (Zhang & He, 2007), sehingga hasilnya tidak gepeng walau difoto miring.

   Aturan platform yang diikuti (sama dengan template Gemini):
   - persis satu blok gaya, satu main, satu blok skrip;
   - nama kedua tag itu tidak pernah ditulis utuh di komentar;
   - semua this.* dipasang sinkron sebelum await pertama;
   - state yang diubah dari callback async dibungkus this.zone.run;
   - tidak ada animasi CSS @keyframes / [ngStyle]. Cahaya scan digambar
     shader WebGL lewat requestAnimationFrame, transisi besar memakai Web
     Animations API (element.animate) pada elemen buatan JS.
   ========================================================================= */
this.pageMain = async () => {
  //#region KONFIGURASI  <<< YANG BIASANYA DIUBAH ADA DI SINI
  /* Naikkan tiap kali berkas ini diubah. Cek versi yang sedang live dari
     console halaman: window.__SCAN_BUILD */
  const BUILD = "scan-261001-5";

  const query = this.activatedRoute?.snapshot?.queryParams ?? {};

  /* Warna cahaya scan (motion "proyeksi") dan aksen lainnya. */
  const ACCENT = "#ED4835";

  /* SEMENTARA MATI — tahap ini fokus ke animasi scan dan tidak ada tombol
     jepret di layar. Alur jepret -> hasil masih ada di skrip untuk tahap
     berikutnya; bisa dicoba dengan ?capture lalu __state.capture() di
     console. */
  const CAPTURE_ENABLED = false;

  /* Scan dianggap berhasil kalau kartu terbaca dan diam selama HOLD_MS.
     Saat itu gambar kamera membeku dan loading tampil di bawah. */
  const HOLD_MS = 1200;

  /* Lama loading sesudah scan berhasil (ms). SEMENTARA SIMULASI — belum ada
     proses sungguhan; sesudahnya kamera jalan lagi dan siap scan berikutnya.
     Lihat region "Berhasil scan". */
  const LOADING_DEMO_MS = 3500;

  /* Tutorial animasi (tanpa teks) muncul begitu halaman dibuka, berulang
     sampai tamu menekan "Lewati". Tombol "?" membukanya lagi. */
  const TUTORIAL_ON_START = true;

  /* Library deteksi. Versinya dikunci supaya perilakunya tidak berubah
     diam-diam. Mau host sendiri: salin folder dist/ scanic ke S3 (CORS *),
     lalu ganti URL ini. */
  const SCANIC_URL = "https://cdn.jsdelivr.net/npm/scanic@1.6.0/dist/scanic.js";

  /* Opsi detektor ML. Tambahkan assetBaseUrl kalau model + runtime-nya
     (paket scanic-ml) di-host sendiri, supaya tidak bergantung ke jsDelivr. */
  const ML_OPTIONS = { minScore: 0.5 };

  /* Rasio kertas, lebar / tinggi.
       "auto"   -> ditebak dari foto (kertas ukuran apa saja)
       210/297  -> A4      148/210 -> A5      4/6 -> kartu 4R
     Kalau diisi angka, orientasinya (tegak / rebah) tetap mengikuti kertas
     di foto. Isi angka kalau kertasnya dicetak sendiri — hasilnya paling
     presisi. */
  const DOC_RATIO = "auto";

  /* Resolusi kamera yang diminta. Browser memilih yang terdekat yang
     didukung perangkat; makin besar makin tajam tulisan di hasil scan. */
  const CAMERA_IDEAL = { width: 3840, height: 2160 };

  /* Hasil */
  const OUTPUT_MAX = 2400; // sisi terpanjang gambar hasil (px)
  const JPEG_QUALITY = 0.92;
  const DEFAULT_FILTER = "clean"; // original | clean | bw

  /* Dipanggil setiap kali hasil scan siap atau berubah (ganti filter, putar,
     atur sudut). Isi kalau hasilnya mau dikirim ke server, Gemini, atau
     dicetak, misalnya:
       const ON_SCAN_READY = (canvas, dataUrl) => { ... };          */
  const ON_SCAN_READY = null;

  this.copy = {
    prompt: "Scan strip foto atau QR kamu",
    loading: "Memproses…",
    resultTitle: "Hasil scan",
    adjustTitle: "Atur sudut",
    adjustHint: "Geser titik di tiap sudut sampai pas dengan tepi kertas.",
    saved: "Tersimpan",
    errInsecure: "Kamera hanya bisa dibuka lewat https.",
    errDenied: "Akses kamera diblokir. Izinkan kamera di browser, lalu coba lagi.",
    errNotFound: "Tidak ada kamera yang bisa dipakai di perangkat ini.",
    errBusy: "Kamera sedang dipakai aplikasi lain. Tutup dulu, lalu coba lagi.",
    errGeneric: "Kamera tidak bisa dinyalakan. Coba lagi.",
  };

  this.labels = {
    upload: "Unggah foto",
    torch: "Lampu kilat",
    switchCamera: "Ganti kamera",
    tryAgain: "Coba lagi",
    skip: "Lewati",
    help: "Cara scan",
    filterGroup: "Tampilan hasil",
    rotate: "Putar",
    adjust: "Atur sudut",
    rescan: "Scan lagi",
    save: "Simpan",
    cancel: "Batal",
    apply: "Terapkan",
  };

  this.filters = [
    { key: "original", label: "Asli" },
    { key: "clean", label: "Bersih" },
    { key: "bw", label: "Hitam putih" },
  ];
  //#endregion

  //#region Penyetelan (jarang perlu diubah)
  const DETECT_SIZE = 384; // sisi terpanjang frame untuk deteksi live (px)
  const PRECISE_SIZE = 1024; // ukuran foto untuk deteksi ulang saat jepret
  const DETECT_GAP_MS = 80; // jeda minimum antar deteksi live
  const MIN_AREA = 0.06; // kertas minimal 6% frame supaya dianggap ketemu
  const HITS_TO_LOCK = 2; // deteksi berturut-turut sebelum cahaya muncul
  const MISSES_TO_LOSE = 4; // deteksi gagal berturut-turut sebelum cahaya hilang
  const STILL_MAX = 4096; // foto unggahan dikecilkan ke ukuran ini
  const EDGE_TRIM_PX = 3; // tepi hasil dipangkas sekian piksel (foto asli) supaya tidak ada garis latar
  const LIGHT_SCALE_MAX = 1.5; // resolusi kanvas cahaya maks (x piksel CSS); efeknya lembut, tidak perlu resolusi penuh
  const OUTSIDE_DIM = 0.38; // gelapnya area di luar kertas saat kertas terdeteksi (0-1)
  const AUTO_MIN_AREA = 0.1; // kartu minimal 10% frame supaya scan boleh dianggap berhasil
  const STEADY_TOLERANCE = 0.02; // geseran sudut maks (proporsi diagonal frame) yang masih dianggap diam
  const REARM_MS = 5000; // sesudah satu scan: tunggu kartunya diangkat, atau selama ini
  //#endregion

  //#region State
  this.screen = "camera"; // camera | result | adjust
  this.cameraState = "loading"; // loading | ready | error
  this.cameraMessage = "";
  this.isBusy = false;
  this.revealing = false;
  this.canAdjust = false;
  this.hasManyCameras = false;
  this.torchAvailable = false;
  this.torchOn = false;
  this.tutorialOpen = TUTORIAL_ON_START && !("notutorial" in query);
  this.loading = false; // true selama loading sesudah scan berhasil
  this.filter = DEFAULT_FILTER;
  this.resultUrl = "";
  this.toast = "";
  this.isEnableUpload = ["IsUpload", "isUpload", "isEnableUpload"].some((key) => key in query);

  const CAN_CAPTURE = CAPTURE_ENABLED || "capture" in query;

  /* Semua yang bukan untuk template (stream, kanvas, library) disimpan di
     sini, BUKAN di this, supaya tidak ikut dipantau change detection dan
     tidak dibungkus proxy oleh harness preview. */
  const E = {
    mod: null,
    scanner: null,
    ml: false,
    engine: null,
    engineFailed: false,
    host: null,
    camToken: 0,
    stream: null,
    track: null,
    video: null,
    deviceIds: [],
    deviceIndex: -1,
    wasRunning: false,
    raf: 0,
    layer: null,
    gl: null,
    glBroken: false,
    ctx: null,
    scale: 1,
    orphan: 0,
    lastNow: 0,
    detecting: false,
    lastDetect: 0,
    detectGap: DETECT_GAP_MS,
    frame: document.createElement("canvas"),
    frameCtx: null,
    hits: 0,
    misses: 0,
    target: null,
    shown: null,
    alpha: 0,
    lockAt: 0,
    aspect: 0,
    anchor: null,
    steadySince: 0,
    bigEnough: false,
    rearmAt: 0,
    frozen: false,
    still: null,
    corners: null,
    warped: null,
    cleanData: null,
    cache: {},
    rotation: 0,
    out: null,
    editor: null,
  };

  const ui = (fn) => (this.zone?.run ? this.zone.run(fn) : fn());
  const REDUCED = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches === true;
  //#endregion

  //#region Utilitas
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
  const nextFrames = async (n) => {
    for (let i = 0; i < n; i++) await nextFrame();
  };
  const buzz = (pattern) => {
    try {
      navigator.vibrate?.(pattern);
    } catch {}
  };

  /* Halaman platform bisa ditinggal tanpa pemberitahuan. Elemen .scn-host
     yang sudah lepas dari DOM = halaman ini sudah tidak tampil. */
  const alive = () => !E.host || E.host.isConnected;

  const waitFor = async (selector, sized = false, timeout = 2500) => {
    const start = performance.now();
    for (;;) {
      const el = document.querySelector(selector);
      if (el) {
        const box = el.getBoundingClientRect();
        if (!sized || (box.width > 0 && box.height > 0)) return el;
      }
      if (performance.now() - start > timeout) return el;
      await nextFrame();
    }
  };

  const drawScaled = (src, scale) => {
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(src.width * scale));
    canvas.height = Math.max(1, Math.round(src.height * scale));
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
    return canvas;
  };

  const loadImage = (url) =>
    new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });

  let toastTimer = 0;
  const showToast = (text) => {
    clearTimeout(toastTimer);
    ui(() => (this.toast = text));
    toastTimer = setTimeout(() => ui(() => (this.toast = "")), 1800);
  };
  //#endregion

  //#region Geometri
  const ORDER = ["topLeft", "topRight", "bottomRight", "bottomLeft"];
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const centroid = (q) => ({ x: (q[0].x + q[1].x + q[2].x + q[3].x) / 4, y: (q[0].y + q[1].y + q[2].y + q[3].y) / 4 });
  const lerpQuad = (a, b, t) => a.map((p, i) => ({ x: p.x + (b[i].x - p.x) * t, y: p.y + (b[i].y - p.y) * t }));
  const toCorners = (q) => ({ topLeft: q[0], topRight: q[1], bottomRight: q[2], bottomLeft: q[3] });
  const insetQuad = (w, h) => [
    { x: w * 0.1, y: h * 0.1 },
    { x: w * 0.9, y: h * 0.1 },
    { x: w * 0.9, y: h * 0.9 },
    { x: w * 0.1, y: h * 0.9 },
  ];

  /* Urutkan searah jarum jam mulai dari sudut kiri atas: TL, TR, BR, BL. */
  const orderQuad = (q) => {
    const c = centroid(q);
    const s = [...q].sort((a, b) => Math.atan2(a.y - c.y, a.x - c.x) - Math.atan2(b.y - c.y, b.x - c.x));
    let first = 0;
    for (let i = 1; i < 4; i++) if (s[i].x + s[i].y < s[first].x + s[first].y) first = i;
    return [0, 1, 2, 3].map((i) => s[(first + i) % 4]);
  };

  /* Kertas yang miring ~45° bisa membuat "sudut kiri atas" berpindah dari
     satu frame ke frame berikutnya. Urutan sudut q diputar supaya paling
     dekat dengan ref, jadi kotak cahayanya tidak terpelintir. */
  const alignQuad = (q, ref) => {
    let best = q;
    let bestCost = Infinity;
    for (let s = 0; s < 4; s++) {
      const cand = [0, 1, 2, 3].map((i) => q[(i + s) % 4]);
      const cost = cand.reduce((sum, p, i) => sum + dist(p, ref[i]), 0);
      if (cost < bestCost) {
        bestCost = cost;
        best = cand;
      }
    }
    return best;
  };

  const quadArea = (q) => {
    let sum = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i];
      const b = q[(i + 1) % 4];
      sum += a.x * b.y - b.x * a.y;
    }
    return Math.abs(sum) / 2;
  };

  /* Segi empat yang masuk akal sebagai kertas: cembung, tiap sudut dalamnya
     antara ~35° dan ~145°, dan cukup besar. */
  const quadOk = (q, w, h) => {
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i];
      const b = q[(i + 1) % 4];
      const c = q[(i + 2) % 4];
      const z = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
      if (!z || (sign && Math.sign(z) !== sign)) return false;
      sign = Math.sign(z);
      const v1x = a.x - b.x;
      const v1y = a.y - b.y;
      const v2x = c.x - b.x;
      const v2y = c.y - b.y;
      const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y));
      if (Math.abs(cos) > 0.82) return false;
    }
    return quadArea(q) >= MIN_AREA * w * h;
  };

  /* Homografi persegi satuan (u, v) -> segi empat q (Heckbert):
       x = (a u + b v + c) / (g u + h v + 1)
       y = (d u + e v + f) / (g u + h v + 1)                              */
  const squareToQuad = (q) => {
    const [p0, p1, p2, p3] = q;
    const dx1 = p1.x - p2.x;
    const dx2 = p3.x - p2.x;
    const dy1 = p1.y - p2.y;
    const dy2 = p3.y - p2.y;
    const sx = p0.x - p1.x + p2.x - p3.x;
    const sy = p0.y - p1.y + p2.y - p3.y;
    let g = 0;
    let h = 0;
    if (Math.abs(sx) > 1e-9 || Math.abs(sy) > 1e-9) {
      const den = dx1 * dy2 - dx2 * dy1;
      g = (sx * dy2 - dx2 * sy) / den;
      h = (dx1 * sy - sx * dy1) / den;
    }
    return [p1.x - p0.x + g * p1.x, p3.x - p0.x + h * p3.x, p0.x, p1.y - p0.y + g * p1.y, p3.y - p0.y + h * p3.y, p0.y, g, h];
  };

  /* Invers matriks 3x3 (baris demi baris), atau null kalau tak terbalikkan. */
  const invert3 = (m) => {
    const [a, b, c, d, e, f, g, h, i] = m;
    const A = e * i - f * h;
    const B = -(d * i - f * g);
    const C = d * h - e * g;
    const det = a * A + b * B + c * C;
    if (!Number.isFinite(det) || Math.abs(det) < 1e-12) return null;
    const s = 1 / det;
    return [A * s, -(b * i - c * h) * s, (b * f - c * e) * s, B * s, (a * i - c * g) * s, -(a * f - c * d) * s, C * s, -(a * h - b * g) * s, (a * e - b * d) * s];
  };

  /* transform CSS yang memetakan elemen berukuran w x h (origin 0 0, posisi
     fixed di 0,0) tepat ke segi empat q di layar. */
  const quadMatrix = (q, w, h) => {
    const [a, b, c, d, e, f, g, hh] = squareToQuad(q);
    const m = [a / w, d / w, 0, g / w, b / h, e / h, 0, hh / h, 0, 0, 1, 0, c, f, 0, 1];
    return `matrix3d(${m.map((n) => n.toFixed(12)).join(",")})`;
  };

  /* Rasio asli kertas (lebar / tinggi) dari empat sudutnya di foto.
     Zhang & He 2007: panjang fokus kamera ditebak dari segi empat itu
     sendiri (titik pusat lensa dianggap di tengah foto). Kalau fotonya
     hampir tegak lurus (perspektifnya tipis), rumusnya tidak stabil, jadi
     dipakai rata-rata panjang sisi. Diuji: meleset median 0,27% vs 2,8%
     kalau hanya memakai panjang sisi. */
  const estimateRatio = (q, iw, ih) => {
    const [tl, tr, br, bl] = q;
    const fallback = (dist(tl, tr) + dist(bl, br)) / (dist(tl, bl) + dist(tr, br));
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const u0 = iw / 2;
    const v0 = ih / 2;
    const m1 = [tl.x, tl.y, 1];
    const m2 = [tr.x, tr.y, 1];
    const m3 = [bl.x, bl.y, 1];
    const m4 = [br.x, br.y, 1];
    const k2 = dot(cross(m1, m4), m3) / dot(cross(m2, m4), m3);
    const k3 = dot(cross(m1, m4), m2) / dot(cross(m3, m4), m2);
    const n2 = m2.map((c, i) => k2 * c - m1[i]);
    const n3 = m3.map((c, i) => k3 * c - m1[i]);
    const f2 = -((n2[0] - u0 * n2[2]) * (n3[0] - u0 * n3[2]) + (n2[1] - v0 * n2[2]) * (n3[1] - v0 * n3[2])) / (n2[2] * n3[2]);
    const diag = Math.hypot(iw, ih);
    if (!(f2 > 0) || !Number.isFinite(f2)) return fallback;
    const f = Math.sqrt(f2);
    if (f < 0.25 * diag || f > 6 * diag) return fallback;
    const len = (n) => Math.hypot((n[0] - u0 * n[2]) / f, (n[1] - v0 * n[2]) / f, n[2]);
    const r = len(n2) / len(n3);
    if (!Number.isFinite(r) || r <= 0 || r / fallback > 1.6 || fallback / r > 1.6) return fallback;
    return r;
  };

  const pathQuad = (ctx, q) => {
    ctx.moveTo(q[0].x, q[0].y);
    ctx.lineTo(q[1].x, q[1].y);
    ctx.lineTo(q[2].x, q[2].y);
    ctx.lineTo(q[3].x, q[3].y);
    ctx.closePath();
  };
  //#endregion

  //#region Mesin deteksi (scanic) — di Web Worker kalau bisa
  /* Deteksi berjalan di Web Worker supaya animasi cahaya tetap mulus: satu
     deteksi ML makan 30-100 ms, dan kalau dikerjakan di thread utama
     animasinya ikut tersendat. Worker-nya dibuat dari teks di bawah ini
     (Blob URL), jadi halaman tetap satu berkas. Browser yang tidak bisa
     (tanpa module worker / OffscreenCanvas) otomatis memakai thread utama.

     Library di thread utama tetap dimuat, karena editor "Atur sudut"
     berasal dari sana. */
  const WORKER_SOURCE = `
const SCANIC_URL = ${JSON.stringify(SCANIC_URL)};
const ML_OPTIONS = ${JSON.stringify(ML_OPTIONS)};
let scanner = null;
let ml = false;
const ready = (async () => {
  const mod = await import(SCANIC_URL);
  scanner = new mod.Scanner();
  await scanner.initialize();
  try {
    await scanner.scan(new OffscreenCanvas(64, 64), { mode: "detect", detector: "ml", ml: ML_OPTIONS });
    ml = true;
  } catch (err) {}
  postMessage({ type: "ready", ml });
})();
ready.catch((err) => postMessage({ type: "failed", message: String((err && err.message) || err) }));
onmessage = async (event) => {
  const { id, image } = event.data;
  let corners = null;
  try {
    await ready;
    const r = await scanner.scan(image, ml ? { mode: "detect", detector: "ml", ml: ML_OPTIONS } : { mode: "detect" });
    if (r && r.success && r.corners) corners = r.corners;
  } catch (err) {}
  if (image && image.close) image.close();
  postMessage({ type: "result", id, corners });
};
`;

  const DW = { worker: null, url: "", ready: false, dead: false, seq: 0, waiting: new Map() };

  const startWorker = () => {
    if (DW.worker || DW.dead) return;
    if (typeof Worker !== "function" || typeof OffscreenCanvas !== "function" || typeof createImageBitmap !== "function") {
      DW.dead = true;
      return;
    }
    try {
      DW.url = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: "text/javascript" }));
      DW.worker = new Worker(DW.url, { type: "module" });
    } catch (err) {
      console.warn("[scan] worker tidak bisa dibuat, deteksi di thread utama", err);
      workerDown();
      return;
    }
    DW.worker.onmessage = (event) => {
      const m = event.data || {};
      if (m.type === "result") {
        const done = DW.waiting.get(m.id);
        DW.waiting.delete(m.id);
        done?.(m.corners);
      } else if (m.type === "ready") {
        DW.ready = true;
        E.ml = m.ml;
        URL.revokeObjectURL(DW.url);
        console.info(`[scan] mesin deteksi siap di worker (${m.ml ? "ML" : "klasik"})`);
      } else if (m.type === "failed") {
        console.warn("[scan] worker gagal memuat scanic", m.message);
        workerDown();
      }
    };
    DW.worker.onerror = (event) => {
      console.warn("[scan] worker error", event?.message || event);
      workerDown();
    };
  };

  /* Worker tidak bisa dipakai: deteksi pindah ke thread utama. */
  const workerDown = () => {
    DW.dead = true;
    DW.ready = false;
    DW.worker?.terminate();
    DW.worker = null;
    if (DW.url) URL.revokeObjectURL(DW.url);
    for (const done of DW.waiting.values()) done(null);
    DW.waiting.clear();
    loadEngine().then(initMainDetector);
  };

  const askWorker = (image) =>
    new Promise((resolve) => {
      const id = ++DW.seq;
      DW.waiting.set(id, resolve);
      DW.worker.postMessage({ id, image }, [image]);
      setTimeout(() => {
        if (!DW.waiting.has(id)) return;
        DW.waiting.delete(id);
        resolve(null);
      }, 5000);
    });

  const loadEngine = () => {
    if (E.engine) return E.engine;
    E.engine = (async () => {
      try {
        E.mod = await import(SCANIC_URL);
        ui(() => (this.canAdjust = true));
      } catch (err) {
        console.warn("[scan] scanic gagal dimuat di thread utama", err);
      }
    })();
    return E.engine;
  };

  /* Cadangan kalau worker tidak tersedia: detektor di thread utama. */
  const initMainDetector = async () => {
    if (E.scanner) return;
    if (!E.mod) {
      E.engineFailed = true;
      return;
    }
    try {
      const scanner = new E.mod.Scanner();
      await scanner.initialize();
      E.scanner = scanner;
    } catch (err) {
      console.warn("[scan] detektor tidak bisa dijalankan, kamera jalan tanpa deteksi", err);
      E.engineFailed = true;
      return;
    }
    try {
      const probe = document.createElement("canvas");
      probe.width = probe.height = 64;
      await E.scanner.scan(probe, { mode: "detect", detector: "ml", ml: ML_OPTIONS });
      E.ml = true;
    } catch (err) {
      console.warn("[scan] detektor ML gagal dimuat, pakai detektor klasik", err);
    }
    console.info(`[scan] mesin deteksi siap di thread utama (${E.ml ? "ML" : "klasik"})`);
  };

  const canDetect = () => DW.ready || Boolean(E.scanner);

  /* Tunggu mesin deteksi siap (model ML ~2 MB baru diunduh saat halaman
     pertama dibuka). setTimeout, bukan requestAnimationFrame, supaya tetap
     jalan walau tab sedang tidak tampil. */
  const detectorReady = async (timeout) => {
    const start = performance.now();
    while (!canDetect() && !E.engineFailed && performance.now() - start < timeout) await new Promise((r) => setTimeout(r, 100));
    return canDetect();
  };

  /* Sudut kertas di `source` (video atau kanvas) yang dikecilkan ke w x h.
     Hasilnya dalam koordinat w x h, urut TL, TR, BR, BL — atau null. */
  const detectAt = async (source, w, h) => {
    let raw = null;
    if (DW.ready) {
      let bitmap = null;
      try {
        bitmap = await createImageBitmap(source, { resizeWidth: w, resizeHeight: h, resizeQuality: "medium" });
      } catch {
        /* Sebagian browser belum bisa membuat bitmap langsung dari <video>:
           lewat kanvas dulu. */
        try {
          if (E.frame.width !== w || E.frame.height !== h) {
            E.frame.width = w;
            E.frame.height = h;
          }
          if (!E.frameCtx) E.frameCtx = E.frame.getContext("2d", { willReadFrequently: true });
          E.frameCtx.drawImage(source, 0, 0, w, h);
          bitmap = await createImageBitmap(E.frame);
        } catch {}
      }
      if (bitmap) {
        const bw = bitmap.width;
        const bh = bitmap.height;
        const c = await askWorker(bitmap);
        if (c) raw = ORDER.map((key) => ({ x: (c[key].x * w) / bw, y: (c[key].y * h) / bh }));
      }
    } else if (E.scanner) {
      if (E.frame.width !== w || E.frame.height !== h) {
        E.frame.width = w;
        E.frame.height = h;
      }
      if (!E.frameCtx) E.frameCtx = E.frame.getContext("2d", { willReadFrequently: true });
      E.frameCtx.drawImage(source, 0, 0, w, h);
      try {
        const r = await E.scanner.scan(E.frame, E.ml ? { mode: "detect", detector: "ml", ml: ML_OPTIONS } : { mode: "detect" });
        if (r?.success && r.corners) raw = ORDER.map((key) => ({ x: r.corners[key].x, y: r.corners[key].y }));
      } catch (err) {
        console.warn("[scan] deteksi gagal", err);
      }
    }
    if (!raw) return null;
    const q = orderQuad(raw);
    return quadOk(q, w, h) ? q : null;
  };

  /* Deteksi ulang di foto yang sudah dijepret (lebih tajam daripada frame
     live yang kecil), lalu sudutnya ditajamkan di resolusi tinggi. */
  const preciseCorners = async (still) => {
    const scale = Math.min(1, PRECISE_SIZE / Math.max(still.width, still.height));
    const w = Math.round(still.width * scale);
    const h = Math.round(still.height * scale);
    const q = await detectAt(still, w, h);
    if (!q) return null;
    return refineCorners(
      still,
      q.map((p) => ({ x: (p.x * still.width) / w, y: (p.y * still.height) / h })),
    );
  };
  //#endregion

  //#region Penajaman sudut
  /* Detektor ML membaca foto berukuran 224 px, jadi sudutnya bisa meleset
     beberapa piksel di foto aslinya — cukup untuk menyisakan garis tipis
     latar di tepi hasil. Di sini, di sekitar tiap sisi, dicari tepi kertas
     yang sebenarnya (perubahan terang-gelap paling kuat di dekat tebakan),
     ditarik garis lurus lewat titik-titik itu, lalu garis-garisnya
     dipotongkan jadi sudut baru.
     Diuji pada 24 foto berlabel: kartu di atas meja jadi presisi ~0,05%
     dari diagonal (sebelumnya 0,4-1,9%). Sisi yang tepinya tidak jelas
     atau tidak lurus dibiarkan memakai tebakan awal. */
  const fitLine = (pts) => {
    const fit = (list) => {
      let mx = 0;
      let my = 0;
      for (const p of list) {
        mx += p.x;
        my += p.y;
      }
      mx /= list.length;
      my /= list.length;
      let sxx = 0;
      let sxy = 0;
      let syy = 0;
      for (const p of list) {
        const dx = p.x - mx;
        const dy = p.y - my;
        sxx += dx * dx;
        sxy += dx * dy;
        syy += dy * dy;
      }
      const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
      return { x: mx, y: my, dx: Math.cos(th), dy: Math.sin(th) };
    };
    const off = (p, l) => Math.abs((p.x - l.x) * -l.dy + (p.y - l.y) * l.dx);
    let line = fit(pts);
    let keep = pts;
    for (let pass = 0; pass < 2; pass++) {
      const r = pts.map((p) => off(p, line)).sort((a, b) => a - b);
      const limit = Math.max(1, 2.5 * r[Math.floor(r.length / 2)]);
      const next = pts.filter((p) => off(p, line) <= limit);
      if (next.length < 6) break;
      keep = next;
      line = fit(keep);
    }
    line.inliers = keep.length / pts.length;
    return line;
  };

  const meet = (a, b) => {
    const den = a.dx * b.dy - a.dy * b.dx;
    if (Math.abs(den) < 1e-6) return null;
    const t = ((b.x - a.x) * b.dy - (b.y - a.y) * b.dx) / den;
    return { x: a.x + a.dx * t, y: a.y + a.dy * t };
  };

  const refineQuad = (g, W, H, q) => {
    const c = centroid(q);
    const R = Math.max(5, Math.hypot(W, H) * 0.012); // jangkauan cari: 1,2% diagonal
    const STEP = 0.5;
    const N = Math.round((2 * R) / STEP);
    const K = 40; // titik sampel per sisi
    const prof = new Float32Array(N + 1);
    const at = (x, y) => {
      if (x < 0 || y < 0 || x > W - 1.001 || y > H - 1.001) return -1;
      const x0 = x | 0;
      const y0 = y | 0;
      const fx = x - x0;
      const fy = y - y0;
      const i = y0 * W + x0;
      return g[i] * (1 - fx) * (1 - fy) + g[i + 1] * fx * (1 - fy) + g[i + W] * (1 - fx) * fy + g[i + W + 1] * fx * fy;
    };

    const lines = [];
    for (let s = 0; s < 4; s++) {
      const p = q[s];
      const r = q[(s + 1) % 4];
      const len = dist(p, r);
      if (len < 20) {
        lines.push(null);
        continue;
      }
      const tx = (r.x - p.x) / len;
      const ty = (r.y - p.y) / len;
      let nx = -ty;
      let ny = tx;
      if (((p.x + r.x) / 2 - c.x) * nx + ((p.y + r.y) / 2 - c.y) * ny < 0) {
        nx = -nx; // normal selalu mengarah ke luar kertas
        ny = -ny;
      }
      const samples = [];
      for (let k = 0; k < K; k++) {
        const f = 0.08 + 0.84 * (k / (K - 1));
        const bx = p.x + (r.x - p.x) * f;
        const by = p.y + (r.y - p.y) * f;
        let inside = true;
        for (let j = 0; j <= N && inside; j++) {
          const v = at(bx + nx * (-R + j * STEP), by + ny * (-R + j * STEP));
          if (v < 0) inside = false;
          else prof[j] = v;
        }
        if (!inside) continue;
        const neg = { score: 0, j: -1 };
        const pos = { score: 0, j: -1 };
        for (let j = 2; j <= N - 2; j++) {
          const grad = (prof[j + 2] - prof[j - 2]) / 2;
          const o = (-R + j * STEP) / (R * 0.6);
          const score = Math.abs(grad) * Math.exp(-o * o); // tepi yang dekat tebakan lebih dipercaya
          if (grad < 0 && score > neg.score) Object.assign(neg, { score, j });
          if (grad > 0 && score > pos.score) Object.assign(pos, { score, j });
        }
        samples.push({ bx, by, neg, pos });
      }
      /* Arah tepi (kertas lebih terang atau lebih gelap dari latar) diambil
         dari suara terbanyak di sisi ini. */
      let sumNeg = 0;
      let sumPos = 0;
      for (const sm of samples) {
        sumNeg += sm.neg.score;
        sumPos += sm.pos.score;
      }
      const pts = [];
      for (const sm of samples) {
        const best = sumNeg >= sumPos ? sm.neg : sm.pos;
        if (best.j < 0 || best.score < 3) continue;
        const o = -R + best.j * STEP;
        pts.push({ x: sm.bx + nx * o, y: sm.by + ny * o });
      }
      if (pts.length < K * 0.35) {
        lines.push(null);
        continue;
      }
      const line = fitLine(pts);
      const angle = Math.abs(Math.asin(clamp(line.dx * ty - line.dy * tx, -1, 1)));
      lines.push(line.inliers >= 0.4 && angle <= 0.105 ? line : null); // maks ~6°
    }

    const out = q.map((p, i) => {
      const a = lines[(i + 3) % 4];
      const b = lines[i];
      const x = a && b ? meet(a, b) : null;
      return x && dist(x, p) <= R * 2.5 ? x : p;
    });
    return quadOk(out, W, H) ? out : q;
  };

  const refineCorners = (still, q) => {
    try {
      const scale = Math.min(1, 1600 / Math.max(still.width, still.height));
      const small = drawScaled(still, scale);
      const W = small.width;
      const H = small.height;
      const d = small.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, W, H).data;
      const g = new Float32Array(W * H);
      for (let i = 0, j = 0; j < g.length; i += 4, j++) g[j] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      const out = refineQuad(
        g,
        W,
        H,
        q.map((p) => ({ x: p.x * scale, y: p.y * scale })),
      );
      return out.map((p) => ({ x: p.x / scale, y: p.y / scale }));
    } catch (err) {
      console.warn("[scan] penajaman sudut dilewati", err);
      return q;
    }
  };
  //#endregion

  //#region Kamera
  const stopCamera = () => {
    E.camToken++;
    cancelAnimationFrame(E.raf);
    E.raf = 0;
    E.stream?.getTracks().forEach((track) => track.stop());
    E.stream = null;
    E.track = null;
    if (E.video) {
      try {
        E.video.srcObject = null;
      } catch {}
    }
    E.video = null;
    dropLayer();
  };

  const cameraError = (err) => {
    console.error("[scan] kamera", err);
    let msg = this.copy.errGeneric;
    if (!window.isSecureContext) msg = this.copy.errInsecure;
    else if (err?.name === "NotAllowedError" || err?.name === "SecurityError") msg = this.copy.errDenied;
    else if (err?.name === "NotFoundError" || err?.name === "OverconstrainedError") msg = this.copy.errNotFound;
    else if (err?.name === "NotReadableError" || err?.name === "AbortError") msg = this.copy.errBusy;
    ui(() => {
      this.cameraState = "error";
      this.cameraMessage = msg;
    });
  };

  const waitForVideo = async (video, timeout = 4000) => {
    const start = performance.now();
    while (!video.videoWidth && performance.now() - start < timeout) await nextFrame();
    return video.videoWidth > 0;
  };

  this.startCamera = async () => {
    stopCamera();
    const token = E.camToken;
    loadEngine();
    ui(() => {
      this.cameraState = "loading";
      this.cameraMessage = "";
      this.torchOn = false;
    });

    if (!navigator.mediaDevices?.getUserMedia) {
      cameraError({ name: window.isSecureContext ? "NotFoundError" : "SecurityError" });
      return;
    }

    const video = { width: { ideal: CAMERA_IDEAL.width }, height: { ideal: CAMERA_IDEAL.height } };
    if (E.deviceIndex >= 0 && E.deviceIds[E.deviceIndex]) video.deviceId = { exact: E.deviceIds[E.deviceIndex] };
    else video.facingMode = { ideal: "environment" };

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
    } catch (err) {
      if (token === E.camToken) cameraError(err);
      return;
    }

    const el = await waitFor("#scnVideo");
    if (token !== E.camToken || !el || this.screen !== "camera") {
      stream.getTracks().forEach((track) => track.stop());
      return;
    }

    E.host = el.closest(".scn-host");
    E.stream = stream;
    E.track = stream.getVideoTracks()[0] ?? null;
    E.video = el;
    el.muted = true;
    el.srcObject = stream;
    try {
      await el.play();
    } catch {}
    if (!(await waitForVideo(el)) || token !== E.camToken) {
      if (token === E.camToken) cameraError({ name: "NotReadableError" });
      return;
    }

    try {
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
      E.deviceIds = devices.map((d) => d.deviceId);
      const current = E.track?.getSettings?.().deviceId;
      if (current && E.deviceIds.includes(current)) E.deviceIndex = E.deviceIds.indexOf(current);
    } catch {}
    let torch = false;
    try {
      torch = Boolean(E.track?.getCapabilities?.().torch);
    } catch {}
    if (token !== E.camToken) return;

    resetLive();
    console.info(`[scan] kamera ${el.videoWidth}x${el.videoHeight}`);
    ui(() => {
      this.cameraState = "ready";
      this.hasManyCameras = E.deviceIds.length > 1;
      this.torchAvailable = torch;
    });
    E.raf = requestAnimationFrame(frame);
  };

  this.retryCamera = () => this.startCamera();

  this.switchCamera = () => {
    if (E.deviceIds.length < 2 || this.isBusy) return;
    E.deviceIndex = (Math.max(0, E.deviceIndex) + 1) % E.deviceIds.length;
    this.startCamera();
  };

  this.toggleTorch = async () => {
    const on = !this.torchOn;
    try {
      await E.track?.applyConstraints({ advanced: [{ torch: on }] });
      ui(() => (this.torchOn = on));
    } catch (err) {
      console.warn("[scan] lampu kilat", err);
    }
  };

  /* Pindah aplikasi / tab: kamera dilepas, lalu dinyalakan lagi saat kembali. */
  const onVisibility = () => {
    if (!alive()) {
      document.removeEventListener("visibilitychange", onVisibility);
      return;
    }
    if (document.hidden) {
      if (E.stream && !this.isBusy) {
        E.wasRunning = true;
        stopCamera();
      }
    } else if (E.wasRunning) {
      E.wasRunning = false;
      if (this.screen === "camera") this.startCamera();
    }
  };
  document.addEventListener("visibilitychange", onVisibility);
  //#endregion

  //#region Deteksi live
  const resetLive = () => {
    Object.assign(E, {
      hits: 0,
      misses: 0,
      target: null,
      shown: null,
      alpha: 0,
      aspect: 0,
      anchor: null,
      steadySince: 0,
      bigEnough: false,
      frozen: false,
      lastNow: 0,
      orphan: 0,
      detecting: false,
      lastDetect: 0,
      detectGap: DETECT_GAP_MS,
    });
  };

  const detectLive = async () => {
    const v = E.video;
    if (!v || !v.videoWidth) return;
    const vw = v.videoWidth;
    const vh = v.videoHeight;
    const scale = Math.min(1, DETECT_SIZE / Math.max(vw, vh));
    const w = Math.round(vw * scale);
    const h = Math.round(vh * scale);
    const q = await detectAt(v, w, h);
    if (E.frozen || v !== E.video) return;
    onDetection(q ? q.map((p) => ({ x: (p.x * vw) / w, y: (p.y * vh) / h })) : null, vw, vh);
  };

  const onDetection = (q, vw, vh) => {
    if (!q) {
      E.hits = 0;
      if (++E.misses >= MISSES_TO_LOSE) {
        E.target = null;
        E.anchor = null;
        E.steadySince = 0;
        E.rearmAt = 0; // kartu sudah diangkat: boleh scan lagi
      }
      return;
    }
    E.misses = 0;
    if (!E.target && ++E.hits < HITS_TO_LOCK) return;
    if (!E.target) {
      /* Efek "muncul" hanya diulang kalau cahayanya sudah benar-benar
         padam — kertas yang hilang sekejap tidak membuatnya berkedip. */
      if (E.alpha < 0.3) E.lockAt = performance.now();
      E.shown = null;
      buzz(8);
    } else {
      q = alignQuad(q, E.target);
    }
    E.target = q;
    const ratio = estimateRatio(q, vw, vh);
    E.aspect = E.aspect ? E.aspect + (ratio - E.aspect) * 0.25 : ratio;

    /* diam = keempat sudut bergeser kurang dari STEADY_TOLERANCE */
    E.bigEnough = quadArea(q) >= AUTO_MIN_AREA * vw * vh;
    const drift = E.anchor ? Math.max(...q.map((p, i) => dist(p, E.anchor[i]))) / Math.hypot(vw, vh) : Infinity;
    if (drift > STEADY_TOLERANCE || !E.bigEnough) {
      E.anchor = q;
      E.steadySince = performance.now();
    }
  };

  const frame = (now) => {
    E.raf = requestAnimationFrame(frame);
    const stage = document.getElementById("scnStage");
    const v = E.video;
    if (!stage || !v || !v.isConnected) {
      if (++E.orphan > 45) stopCamera(); // layar berganti atau halaman ditinggal
      return;
    }
    E.orphan = 0;
    const dt = E.lastNow ? Math.min(64, now - E.lastNow) : 16;
    E.lastNow = now;

    /* Selama tutorial tampil: tidak ada deteksi dan tidak ada cahaya di
       belakangnya — mata hanya ke tutorial. */
    if (this.tutorialOpen) {
      ensureLayer(stage);
      renderLight(null, now);
      Object.assign(E, { target: null, shown: null, alpha: 0, hits: 0, misses: 0, anchor: null, steadySince: 0 });
      return;
    }

    if (!E.frozen && !E.detecting && canDetect() && v.videoWidth && now - E.lastDetect >= E.detectGap) {
      E.detecting = true;
      E.lastDetect = now;
      const started = performance.now();
      detectLive().finally(() => {
        E.detecting = false;
        /* Perangkat lambat: beri jeda lebih panjang. Kalau deteksinya di
           thread utama (tanpa worker), jeda ini juga yang menjaga animasi
           tetap mulus. */
        E.detectGap = clamp((performance.now() - started) * (DW.ready ? 1.1 : 1.6), DETECT_GAP_MS, 400);
      });
    }

    /* scan berhasil: kartu cukup besar dan diam selama HOLD_MS. Sesudah satu
       scan, tunggu kartunya diangkat dulu (atau REARM_MS) supaya kartu yang
       sama tidak langsung terbaca lagi. */
    const armed = !E.rearmAt || now >= E.rearmAt;
    if (armed && !E.frozen && E.target && E.bigEnough && E.steadySince && !this.loading && this.cameraState === "ready" && now - E.steadySince >= HOLD_MS) {
      scanSuccess();
    }

    ensureLayer(stage);
    const want = E.target ? 1 : 0;
    E.alpha += (want - E.alpha) * (1 - Math.exp(-dt / (want ? 140 : 220)));
    if (E.target) E.shown = E.shown ? lerpQuad(E.shown, E.target, 1 - Math.exp(-dt / 70)) : E.target.map((p) => ({ ...p }));
    if (!E.shown || E.alpha < 0.01 || !v.videoWidth) {
      if (!E.target) E.shown = null;
      renderLight(null, now);
      return;
    }

    /* Video memakai object-fit: cover, jadi koordinat video dipetakan ke
       layar dengan skala yang MENUTUPI layar (sebagian tepi video terpotong). */
    const bw = stage.clientWidth;
    const bh = stage.clientHeight;
    const vw = v.videoWidth;
    const vh = v.videoHeight;
    const k = Math.max(bw / vw, bh / vh);
    const ox = (bw - vw * k) / 2;
    const oy = (bh - vh * k) / 2;
    renderLight(
      E.shown.map((p) => ({ x: ox + p.x * k, y: oy + p.y * k })),
      now,
    );
  };
  //#endregion

  //#region Lapisan cahaya — inti tampilan scan (WebGL)
  /* Semua efek digambar oleh satu shader WebGL di atas video. Untuk tiap
     piksel layar, shader menghitung balik posisinya di permukaan kertas
     (homografi terbalik), jadi efeknya menempel ke kertas sungguhan dan ikut
     miring bersamanya. Isinya HANYA isian (fill) — tidak ada garis tepi —
     dalam satu warna, ACCENT.

     Motion yang dipakai: "proyeksi" — matriks titik halftone yang ukurannya
     mengikuti pola interferensi dua gelombang, seperti cahaya terstruktur
     pada mesin scan 3D. (Empat pilihan lain yang sempat dibandingkan —
     piksel, termal, jejak, partikel — ada di riwayat git.)
     Semua diawali efek "muncul": isian timbul acak per petak dalam ~0,6 dtk.

     Kalau WebGL tidak tersedia, kertas cukup diberi isian warna polos. */
  const ACCENT_RGB = [1, 3, 5].map((i) => parseInt(ACCENT.slice(i, i + 2), 16) / 255);

  const LIGHT_VERT = "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}";

  const LIGHT_FRAG = `
uniform vec2 uRes;
uniform mat3 uInv;
uniform float uTime;
uniform float uSince;
uniform float uAlpha;
uniform float uAspect;
uniform float uDim;
uniform vec3 uColor;

float hash(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

/* warna aksen; heat mendorongnya ke putih panas */
vec4 glow(float a, float heat) {
  a = clamp(a, 0.0, 1.0);
  vec3 c = mix(uColor, vec3(1.0, 0.9, 0.86), clamp(heat, 0.0, 1.0));
  return vec4(c * a, a);
}

vec4 over(vec4 top, vec4 under) {
  return top + under * (1.0 - top.a);
}

/* 4 proyeksi */
vec4 fxFringe(vec2 q, float px) {
  float n = 36.0;
  vec2 g = q * n;
  vec2 id = floor(g) + 0.5;
  vec2 f = g - id;
  vec2 c = id / n;
  float a1 = uTime * 0.23;
  float a2 = 1.7 - uTime * 0.19;
  float w = 0.5 + 0.25 * sin(dot(c, vec2(cos(a1), sin(a1))) * 15.0 - uTime * 2.4)
                + 0.25 * sin(dot(c, vec2(cos(a2), sin(a2))) * 11.0 + uTime * 1.9);
  float rad = 0.06 + 0.42 * w * w;
  float d = length(f) - rad;
  float aa = px * n;
  float fill = 1.0 - smoothstep(-aa, aa, d);
  return glow(fill * (0.25 + 0.65 * w), smoothstep(0.82, 1.0, w) * 0.55);
}

void main() {
  vec2 sp = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec4 outside = vec4(0.0, 0.0, 0.0, uDim * uAlpha);
  vec3 h = uInv * vec3(sp, 1.0);
  if (h.z <= 0.0) {
    gl_FragColor = outside;
    return;
  }
  vec2 uv = h.xy / h.z;
  vec3 hx = uInv * vec3(sp + vec2(1.0, 0.0), 1.0);
  vec3 hy = uInv * vec3(sp + vec2(0.0, 1.0), 1.0);
  float px = max(length(hx.xy / hx.z - uv), length(hy.xy / hy.z - uv));
  vec2 e = min(uv, 1.0 - uv);
  float inside = clamp(min(e.x, e.y) / px + 0.5, 0.0, 1.0);
  if (inside <= 0.0) {
    gl_FragColor = outside;
    return;
  }
  vec2 q = vec2(uv.x * uAspect, uv.y);
  vec4 fx = fxFringe(q, px);
  float enter = clamp(uSince / 0.65, 0.0, 1.0) * 1.2;
  float vis = 1.0 - smoothstep(enter - 0.2, enter, hash(floor(q * 46.0) + 0.5));
  vec4 paper = over(fx, vec4(uColor * 0.12, 0.12)) * (vis * uAlpha);
  gl_FragColor = mix(outside, paper, inside);
}
`;

  const buildGL = (canvas) => {
    let gl = null;
    try {
      gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
    } catch {}
    if (!gl) return null;
    const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
    const precision = hp && hp.precision > 0 ? "highp" : "mediump";
    const compile = (type, src) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);
      if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
      console.warn("[scan] shader", gl.getShaderInfoLog(shader));
      return null;
    };
    const vs = compile(gl.VERTEX_SHADER, LIGHT_VERT);
    const fs = compile(gl.FRAGMENT_SHADER, `precision ${precision} float;\n${LIGHT_FRAG}`);
    if (!vs || !fs) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.warn("[scan] shader", gl.getProgramInfoLog(prog));
      return null;
    }
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const attr = gl.getAttribLocation(prog, "a");
    gl.enableVertexAttribArray(attr);
    gl.vertexAttribPointer(attr, 2, gl.FLOAT, false, 0, 0);
    const loc = {};
    for (const name of ["uRes", "uInv", "uTime", "uSince", "uAlpha", "uAspect", "uDim", "uColor"]) loc[name] = gl.getUniformLocation(prog, name);
    gl.uniform3f(loc.uColor, ACCENT_RGB[0], ACCENT_RGB[1], ACCENT_RGB[2]);
    gl.uniform1f(loc.uDim, OUTSIDE_DIM);
    return { gl, loc };
  };

  const newLayerCanvas = (stage) => {
    const canvas = document.createElement("canvas");
    canvas.className = "scn-layer";
    canvas.setAttribute("aria-hidden", "true");
    Object.assign(canvas.style, { position: "absolute", inset: "0", width: "100%", height: "100%", pointerEvents: "none", zIndex: "1" });
    stage.appendChild(canvas);
    return canvas;
  };

  const dropLayer = () => {
    try {
      E.gl?.gl.getExtension("WEBGL_lose_context")?.loseContext();
    } catch {}
    E.layer?.remove();
    E.layer = null;
    E.gl = null;
    E.ctx = null;
  };

  const ensureLayer = (stage) => {
    if (!E.layer || E.layer.parentNode !== stage) {
      dropLayer();
      let canvas = newLayerCanvas(stage);
      E.gl = E.glBroken ? null : buildGL(canvas);
      if (!E.gl) {
        /* Kanvas yang sempat dipakai WebGL tidak bisa diberi konteks 2D:
           ganti dengan kanvas baru. */
        if (!E.glBroken) console.warn("[scan] WebGL tidak tersedia, cahaya memakai isian sederhana");
        E.glBroken = true;
        canvas.remove();
        canvas = newLayerCanvas(stage);
        E.ctx = canvas.getContext("2d");
      }
      canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        if (E.layer !== canvas) return;
        canvas.remove(); // dibuat ulang di frame berikutnya
        Object.assign(E, { layer: null, gl: null, ctx: null });
      });
      E.layer = canvas;
    }
    const scale = Math.min(window.devicePixelRatio || 1, LIGHT_SCALE_MAX);
    const w = Math.max(1, Math.round(stage.clientWidth * scale));
    const h = Math.max(1, Math.round(stage.clientHeight * scale));
    if (E.layer.width !== w || E.layer.height !== h) {
      E.layer.width = w;
      E.layer.height = h;
    }
    E.scale = scale;
  };

  /* S: empat sudut kertas di layar (piksel CSS), atau null kalau tidak ada. */
  const renderLight = (S, now) => {
    const canvas = E.layer;
    if (!canvas) return;
    const s = E.scale;
    if (E.gl) {
      const { gl, loc } = E.gl;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      if (!S) return;
      const m = squareToQuad(S.map((p) => ({ x: p.x * s, y: p.y * s })));
      const inv = invert3([m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7], 1]);
      if (!inv) return;
      gl.uniform2f(loc.uRes, canvas.width, canvas.height);
      gl.uniformMatrix3fv(loc.uInv, false, [inv[0], inv[3], inv[6], inv[1], inv[4], inv[7], inv[2], inv[5], inv[8]]);
      gl.uniform1f(loc.uTime, REDUCED ? 3 : (now % 600000) / 1000);
      gl.uniform1f(loc.uSince, REDUCED ? 99 : (now - E.lockAt) / 1000);
      gl.uniform1f(loc.uAlpha, E.alpha);
      gl.uniform1f(loc.uAspect, clamp(E.aspect || 0.75, 0.3, 3));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return;
    }
    const ctx = E.ctx;
    if (!ctx) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!S) return;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width / s, canvas.height / s);
    pathQuad(ctx, S);
    ctx.fillStyle = `rgba(0,0,0,${OUTSIDE_DIM * E.alpha})`;
    ctx.fill("evenodd");
    ctx.beginPath();
    pathQuad(ctx, S);
    ctx.fillStyle = `rgba(${ACCENT_RGB.map((c) => Math.round(c * 255)).join(",")},${0.35 * E.alpha})`;
    ctx.fill();
  };

  //#endregion

  //#region Tutorial (animasi garis, tanpa teks)
  /* Aset garis dari tim desain (Tutorial/Asset motion tutorial-02 & -03),
     dikonversi ke WebP dan disematkan di region "Aset tutorial" paling
     bawah skrip ini (salinannya juga ada di folder assets/):
       TUT_ART.phone   tangan memegang HP — siluetnya diisi gelap supaya
                       menutupi kartu di belakangnya, layarnya tembus pandang
       TUT_ART.card    kartu foto LOL Photobooth
       TUT_ART.shadow  bayangan lembut HP (dibuat dari siluetnya)

     Cerita animasinya, berulang tiap ~6,2 detik:
       1. kartu tergeletak, sedikit "bernapas"
       2. HP datang dari kanan bawah lewat lintasan melengkung, makin turun
          mendekati kartu (skala dan bayangannya mengecil), lalu mendarat
          dengan pegas halus
       3. layar HP memperlihatkan kartu di bawahnya; cahaya "proyeksi" merah
          menyebar dari tengah kartu, lalu menyatu jadi isian
       4. lencana centang muncul memantul
       5. HP ancang-ancang turun sedikit, lalu terangkat pergi ke kiri atas
     Kurvanya cubic-bezier + pegas (seperti graph editor After Effects),
     digerakkan requestAnimationFrame — bukan CSS @keyframes, yang diam di
     platform. */
  const SVG_NS = "http://www.w3.org/2000/svg";
  const TUT_LOOP = 6200;
  /* Ukuran sprite HP (px WebP) dan titik tengah layarnya di dalam sprite. */
  const TUT_PHONE = { w: 900, h: 1133, sx: 335.8, sy: 514.1, screen: { w: 418.2, h: 902.2, rx: 40 } };
  /* Kartu di "meja", dalam koordinat adegan 1000 x 1260. */
  const TUT_CARD = { cx: 500, cy: 580, w: 343, h: 513 };
  const TUT = { raf: 0, parts: null, start: 0, onKey: null, closing: false };

  const svgEl = (tag, attrs, parent) => {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, String(value));
    parent?.appendChild(el);
    return el;
  };

  /* Kurva gerak: cubic-bezier (sama seperti CSS / graph editor AE) dan pegas
     teredam untuk pendaratan yang sedikit memantul. */
  const bezier = (x1, y1, x2, y2) => {
    const cx = 3 * x1;
    const bx = 3 * (x2 - x1) - cx;
    const ax = 1 - cx - bx;
    const cy = 3 * y1;
    const by = 3 * (y2 - y1) - cy;
    const ay = 1 - cy - by;
    return (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const fx = ((ax * t + bx) * t + cx) * t - x;
        const d = (3 * ax * t + 2 * bx) * t + cx;
        if (Math.abs(fx) < 1e-5 || Math.abs(d) < 1e-6) break;
        t = clamp(t - fx / d, 0, 1);
      }
      return ((ay * t + by) * t + cy) * t;
    };
  };
  const EASE = {
    glide: bezier(0.16, 1, 0.3, 1), // datang cepat, berhenti lembut
    swing: bezier(0.65, 0, 0.35, 1), // ancang-ancang
    leave: bezier(0.55, 0, 0.75, 0.2), // pergi makin cepat
    pop: bezier(0.2, 0.9, 0.3, 1),
  };
  const springAt = (t, zeta = 0.45, omega = 9) => {
    if (t <= 0) return 0;
    const wd = omega * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * omega * t) * (Math.cos(wd * t) + ((zeta * omega) / wd) * Math.sin(wd * t));
  };
  const curve = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
  const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

  const buildTutorialArt = (host) => {
    host.textContent = "";
    const svg = svgEl("svg", { viewBox: "0 0 1000 1260", "aria-hidden": "true" }, host);
    const defs = svgEl("defs", {}, svg);
    const sc = TUT_PHONE.screen;
    const clip = svgEl("clipPath", { id: "scnTutClip" }, defs);
    svgEl("rect", { x: -sc.w / 2, y: -sc.h / 2, width: sc.w, height: sc.h, rx: sc.rx }, clip);
    const cardX = TUT_CARD.cx - TUT_CARD.w / 2;
    const cardY = TUT_CARD.cy - TUT_CARD.h / 2;
    const cardImage = (parent, opacity) =>
      svgEl("image", { href: TUT_ART.card, x: cardX, y: cardY, width: TUT_CARD.w, height: TUT_CARD.h, opacity }, parent);

    /* kartu di meja */
    const table = svgEl("g", {}, svg);
    cardImage(table, 0.62);

    /* bayangan HP (di ruang adegan, supaya arahnya tidak ikut berputar) */
    const shadow = svgEl("g", {}, svg);
    svgEl("image", { href: TUT_ART.shadow, x: -TUT_PHONE.sx, y: -TUT_PHONE.sy, width: TUT_PHONE.w, height: TUT_PHONE.h, preserveAspectRatio: "none" }, shadow);

    /* HP: titik asal grup = tengah layar, jadi berputar & membesar dari situ */
    const phone = svgEl("g", {}, svg);
    const screen = svgEl("g", { "clip-path": "url(#scnTutClip)" }, phone);
    svgEl("rect", { x: -sc.w / 2 - 2, y: -sc.h / 2 - 2, width: sc.w + 4, height: sc.h + 4, fill: "#141418" }, screen);
    const world = svgEl("g", {}, screen); // kebalikan transform HP: isinya diam di adegan
    const inner = svgEl("g", {}, world);
    cardImage(inner, 1);
    const fill = svgEl("rect", { x: cardX, y: cardY, width: TUT_CARD.w, height: TUT_CARD.h, rx: 6, fill: ACCENT, opacity: 0 }, inner);
    const dots = [];
    const cols = 14;
    const rows = 21;
    const cw = TUT_CARD.w / cols;
    const ch = TUT_CARD.h / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = cardX + (c + 0.5) * cw;
        const y = cardY + (r + 0.5) * ch;
        const el = svgEl("circle", { cx: x, cy: y, r: 0, fill: ACCENT, opacity: 0 }, inner);
        const d = Math.hypot(x - TUT_CARD.cx, y - TUT_CARD.cy) / Math.hypot(TUT_CARD.w / 2, TUT_CARD.h / 2);
        dots.push({ el, u: (x - cardX) / TUT_CARD.h, v: (y - cardY) / TUT_CARD.h, d, jit: Math.random() });
      }
    }
    const badge = svgEl("g", { opacity: 0 }, inner);
    svgEl("circle", { cx: 0, cy: 0, r: 64, fill: "#fff" }, badge);
    const check = svgEl("path", { d: "M-27 2 L-8 21 L29 -19", fill: "none", stroke: ACCENT, "stroke-width": 15, "stroke-linecap": "round", "stroke-linejoin": "round" }, badge);
    const checkLen = check.getTotalLength ? check.getTotalLength() : 80;
    check.style.strokeDasharray = String(checkLen);
    svgEl("image", { href: TUT_ART.phone, x: -TUT_PHONE.sx, y: -TUT_PHONE.sy, width: TUT_PHONE.w, height: TUT_PHONE.h }, phone);
    return { svg, table, shadow, phone, world, inner, fill, dots, badge, check, checkLen, cell: Math.min(cw, ch) };
  };

  /* Posisi HP relatif terhadap posisi pas (tengah layar = tengah kartu). */
  const phonePose = (t) => {
    const P0 = { x: 520, y: 1150 };
    const P1 = { x: 150, y: 110 };
    if (t < 400) return { x: P0.x, y: P0.y, r: 18, s: 1.16, o: 0, lift: 1 };
    if (t < 1900) {
      const k = (t - 400) / 1500;
      const u = EASE.glide(k);
      const settle = springAt(k * 1.6);
      return { x: curve(P0.x, P1.x, 0, u), y: curve(P0.y, P1.y, 0, u), r: 18 * (1 - settle), s: 1 + 0.16 * (1 - settle), o: span(k, 0, 0.18), lift: 1 - u };
    }
    if (t < 4500) {
      /* tangan tidak pernah benar-benar diam */
      const env = span(t, 1900, 2300) * (1 - span(t, 4150, 4500));
      const w = (t - 1900) / 1000;
      return { x: env * 4 * Math.sin(w * 2.2), y: env * 5 * Math.sin(w * 1.4), r: env * 0.5 * Math.sin(w * 1.8), s: 1, o: 1, lift: 0 };
    }
    if (t < 4750) {
      const k = EASE.swing(span(t, 4500, 4750));
      return { x: 6 * k, y: 26 * k, r: 1.2 * k, s: 1 - 0.02 * k, o: 1, lift: 0 };
    }
    if (t < 5550) {
      const k = span(t, 4750, 5550);
      const u = EASE.leave(k);
      return { x: 6 - 460 * u, y: 26 - 1260 * u, r: 1.2 - 16 * u, s: 0.98 + 0.14 * u, o: 1 - span(k, 0.6, 1), lift: u };
    }
    return { x: -454, y: -1234, r: -14.8, s: 1.12, o: 0, lift: 1 };
  };

  const tutorialFrame = (now) => {
    TUT.raf = requestAnimationFrame(tutorialFrame);
    const P = TUT.parts;
    if (!P || !P.svg.isConnected) {
      stopTutorial();
      return;
    }
    const elapsed = now - TUT.start;
    const t = REDUCED ? 3900 : elapsed % TUT_LOOP;
    const sec = REDUCED ? 3.9 : elapsed / 1000;

    /* 1. kartu: masuk lembut di putaran pertama, lalu "bernapas" */
    const intro = REDUCED ? 1 : EASE.glide(span(elapsed, 0, 700));
    const float = REDUCED ? 0 : 2.5 * Math.sin(sec * 1.4);
    const k0 = 0.96 + 0.04 * intro;
    P.table.setAttribute("transform", `translate(${TUT_CARD.cx} ${TUT_CARD.cy + float}) scale(${k0.toFixed(4)}) translate(${-TUT_CARD.cx} ${-TUT_CARD.cy})`);
    P.table.setAttribute("opacity", intro.toFixed(3));
    P.inner.setAttribute("transform", `translate(0 ${float.toFixed(2)})`);

    /* 2. HP + bayangannya */
    const pose = phonePose(t);
    const px = TUT_CARD.cx + pose.x;
    const py = TUT_CARD.cy + pose.y;
    P.phone.setAttribute("transform", `translate(${px.toFixed(2)} ${py.toFixed(2)}) rotate(${pose.r.toFixed(3)}) scale(${pose.s.toFixed(4)})`);
    P.phone.setAttribute("opacity", pose.o.toFixed(3));
    P.world.setAttribute("transform", `scale(${(1 / pose.s).toFixed(5)}) rotate(${(-pose.r).toFixed(3)}) translate(${(-px).toFixed(2)} ${(-py).toFixed(2)})`);
    const lift = pose.lift;
    P.shadow.setAttribute(
      "transform",
      `translate(${(px + 18 + 70 * lift).toFixed(2)} ${(py + 28 + 110 * lift).toFixed(2)}) rotate(${pose.r.toFixed(3)}) scale(${(pose.s * (1 + 0.05 * lift)).toFixed(4)})`,
    );
    P.shadow.setAttribute("opacity", (pose.o * (0.6 - 0.25 * lift)).toFixed(3));

    /* 3. cahaya "proyeksi" menyebar dari tengah kartu, lalu menyatu */
    const merge = EASE.swing(span(t, 2950, 3300));
    const a1 = sec * 0.23;
    const a2 = 1.7 - sec * 0.19;
    const c1 = Math.cos(a1);
    const s1 = Math.sin(a1);
    const c2 = Math.cos(a2);
    const s2 = Math.sin(a2);
    for (const dot of P.dots) {
      const t0 = 1500 + dot.d * 520 + dot.jit * 90;
      const on = t < t0 ? 0 : EASE.pop(span(t, t0, t0 + 260)) * (1 + 0.25 * Math.sin(Math.PI * span(t, t0, t0 + 260)));
      if (on <= 0.001 || merge >= 0.999) {
        dot.el.setAttribute("r", "0");
        continue;
      }
      const w = 0.5 + 0.25 * Math.sin((dot.u * c1 + dot.v * s1) * 15 - sec * 2.4) + 0.25 * Math.sin((dot.u * c2 + dot.v * s2) * 11 + sec * 1.9);
      const rad = (0.08 + 0.4 * w * w) * P.cell * on * (1 - 0.6 * merge);
      dot.el.setAttribute("r", rad.toFixed(2));
      dot.el.setAttribute("opacity", ((0.3 + 0.65 * w) * (1 - merge)).toFixed(3));
    }
    const flash = Math.sin(Math.PI * span(t, 3000, 3420));
    P.fill.setAttribute("opacity", (0.4 * merge + 0.28 * flash).toFixed(3));

    /* 4. lencana centang memantul */
    const b = span(t, 3150, 4000);
    const bs = springAt(b * 1.3, 0.38, 13);
    P.badge.setAttribute("transform", `translate(${TUT_CARD.cx} ${TUT_CARD.cy}) scale(${Math.max(0, bs).toFixed(4)})`);
    P.badge.setAttribute("opacity", span(t, 3150, 3230).toFixed(3));
    P.check.style.strokeDashoffset = String(P.checkLen * (1 - EASE.glide(span(t, 3300, 3700))));
  };

  const stopTutorial = () => {
    cancelAnimationFrame(TUT.raf);
    TUT.raf = 0;
    TUT.parts = null;
    if (TUT.onKey) document.removeEventListener("keydown", TUT.onKey);
    TUT.onKey = null;
  };

  const startTutorial = async () => {
    const host = await waitFor("#scnTutorial", true);
    if (!host || !this.tutorialOpen) return;
    stopTutorial();
    TUT.parts = buildTutorialArt(host);
    TUT.start = performance.now();
    TUT.raf = requestAnimationFrame(tutorialFrame);
    TUT.onKey = (event) => {
      if (event.key === "Escape") this.closeTutorial();
    };
    document.addEventListener("keydown", TUT.onKey);
    if (!REDUCED) host.closest(".scn-tut")?.animate?.([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: "ease-out" });
  };

  this.openTutorial = () => {
    if (this.tutorialOpen) return;
    ui(() => (this.tutorialOpen = true));
    startTutorial();
  };

  this.closeTutorial = async () => {
    if (!this.tutorialOpen || TUT.closing) return;
    TUT.closing = true;
    const box = document.querySelector(".scn-tut");
    if (box?.animate && !REDUCED) {
      try {
        await box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" }).finished;
      } catch {}
    }
    stopTutorial();
    TUT.closing = false;
    ui(() => (this.tutorialOpen = false));
  };
  //#endregion

  //#region Berhasil scan: gambar membeku + loading
  /* Begitu scan berhasil, gambar kamera MEMBEKU (video dijeda) sementara
