<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap");

/* ==========================================================================
   INTERFACE SCANNER — gaya

   Bootstrap 5.3 (sudah dimuat platform) dipakai untuk tombol, grup tombol,
   dan utilitas jarak/flex. Aturan di bawah ini hanya untuk yang memang tidak
   ada di Bootstrap: layar penuh ala aplikasi kamera, kotak kamera, tombol
   jepret, dan permukaan kaca.

   Semua class diawali "scn-" supaya tidak bentrok dengan tema platform.

   Efek cahaya scan TIDAK ada di sini. Semuanya digambar JS di kanvas (region
   "Lapisan cahaya" di skrip), karena animasi CSS @keyframes dan [ngStyle] di
   dalam layar *ngIf terbukti diam di platform ini (lihat catatan template
   Gemini).
   ========================================================================== */

.scn-host {
  --scn-ink: #000;
  --scn-paper: #fff;
  --scn-mist: rgba(255, 255, 255, 0.66);
  --scn-glass: rgba(30, 30, 36, 0.58);
  --scn-line: rgba(255, 255, 255, 0.14);
  --scn-violet: #7c5cff;
  --scn-blue: #3e8bff;
  --scn-mint: #34e3c4;
  --scn-font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --scn-safe-t: env(safe-area-inset-top, 0px);
  --scn-safe-r: env(safe-area-inset-right, 0px);
  --scn-safe-b: env(safe-area-inset-bottom, 0px);
  --scn-safe-l: env(safe-area-inset-left, 0px);

  position: fixed;
  inset: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--scn-ink);
  color: var(--scn-paper);
  font-family: var(--scn-font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Kiosk tidak boleh bisa digulir: sisa halaman platform (nav / footer) tidak
   boleh menambah tinggi dokumen. */
html,
body {
  overflow: hidden !important;
  overscroll-behavior: none;
  background: #000;
}

.scn-host *,
.scn-host *::before,
.scn-host *::after {
  box-sizing: border-box;
}

/* :where() supaya reset ini ber-specificity nol dan tidak mengalahkan
   aturan satu class di bawahnya. */
.scn-host :where(h1, h2, p) {
  margin: 0;
}

.scn-host :where(button, input, label) {
  font-family: inherit;
}

.scn-host :focus-visible,
.scn-host .btn:focus-visible {
  outline: 2px solid var(--scn-blue);
  outline-offset: 3px;
  box-shadow: none;
}

/* --------------------------------------------------------------------------
   Kerangka layar
   -------------------------------------------------------------------------- */
.scn-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.scn-bar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-height: 3.5rem;
  padding: calc(0.5rem + var(--scn-safe-t)) max(1rem, var(--scn-safe-r)) 0.5rem max(1rem, var(--scn-safe-l));
}

.scn-title {
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.scn-sub {
  max-width: 46ch;
  color: var(--scn-mist);
  font-size: 0.875rem;
  line-height: 1.5;
}

/* --------------------------------------------------------------------------
   Kamera
   -------------------------------------------------------------------------- */
.scn-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: #000;
  isolation: isolate;
}

.scn-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.scn-hint {
  position: absolute;
  z-index: 2;
  top: 0.875rem;
  left: 50%;
  transform: translateX(-50%);
  max-width: calc(100% - 2rem);
  padding: 0.5rem 1.05rem;
  border: 1px solid var(--scn-line);
  border-radius: 999px;
  background: var(--scn-glass);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  backdrop-filter: blur(16px) saturate(150%);
  font-size: 0.9375rem;
  font-weight: 500;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

.scn-state {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  padding: 2rem;
  text-align: center;
}

.scn-state p {
  max-width: 34ch;
  color: var(--scn-mist);
  font-size: 0.9375rem;
  line-height: 1.55;
}

.scn-controls {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
  padding: 1.125rem max(1.25rem, var(--scn-safe-r)) calc(1.125rem + var(--scn-safe-b)) max(1.25rem, var(--scn-safe-l));
}

.scn-side {
  display: flex;
  align-items: center;
  min-width: 0;
}

.scn-side--end {
  justify-content: flex-end;
}

.scn-shutter {
  display: grid;
  place-items: center;
  width: 4.75rem;
  height: 4.75rem;
  padding: 0;
  border: 0.25rem solid var(--scn-paper);
  border-radius: 50%;
  background: transparent;
  transition: transform 0.12s ease, opacity 0.2s ease;
}

.scn-shutter span {
  display: block;
  width: 3.6rem;
  height: 3.6rem;
  border-radius: 50%;
  background: var(--scn-paper);
}

.scn-shutter:active:not(:disabled) {
  transform: scale(0.93);
}

.scn-shutter:disabled {
  opacity: 0.35;
}

/* --------------------------------------------------------------------------
   Tombol: Bootstrap .btn, warnanya diatur lewat variabel --bs-btn-*
   -------------------------------------------------------------------------- */
.scn-host .btn.scn-glass {
  --bs-btn-color: var(--scn-paper);
  --bs-btn-bg: var(--scn-glass);
  --bs-btn-border-color: var(--scn-line);
  --bs-btn-hover-color: var(--scn-paper);
  --bs-btn-hover-bg: rgba(255, 255, 255, 0.14);
  --bs-btn-hover-border-color: rgba(255, 255, 255, 0.22);
  --bs-btn-active-color: var(--scn-paper);
  --bs-btn-active-bg: rgba(255, 255, 255, 0.2);
  --bs-btn-active-border-color: rgba(255, 255, 255, 0.28);
  --bs-btn-disabled-color: var(--scn-paper);
  --bs-btn-disabled-bg: var(--scn-glass);
  --bs-btn-disabled-border-color: var(--scn-line);
  --bs-btn-padding-x: 1rem;
  --bs-btn-padding-y: 0.55rem;
  --bs-btn-font-size: 0.875rem;
  --bs-btn-font-weight: 500;
  --bs-btn-border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  white-space: nowrap;
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  backdrop-filter: blur(16px) saturate(150%);
}

.scn-host .btn.scn-solid {
  --bs-btn-color: #000;
  --bs-btn-bg: var(--scn-paper);
  --bs-btn-border-color: var(--scn-paper);
  --bs-btn-hover-color: #000;
  --bs-btn-hover-bg: #e8e8ee;
  --bs-btn-hover-border-color: #e8e8ee;
  --bs-btn-active-color: #000;
  --bs-btn-active-bg: #d9d9e2;
  --bs-btn-active-border-color: #d9d9e2;
  --bs-btn-disabled-color: #000;
  --bs-btn-disabled-bg: var(--scn-paper);
  --bs-btn-disabled-border-color: var(--scn-paper);
  --bs-btn-disabled-opacity: 0.45;
  --bs-btn-padding-x: 1.25rem;
  --bs-btn-padding-y: 0.8rem;
  --bs-btn-font-size: 0.9375rem;
  --bs-btn-font-weight: 600;
  --bs-btn-border-radius: 999px;
  white-space: nowrap;
}

.scn-host .btn.scn-lg {
  --bs-btn-padding-x: 1.25rem;
  --bs-btn-padding-y: 0.8rem;
  --bs-btn-font-size: 0.9375rem;
}

.scn-host .btn.scn-round {
  --bs-btn-padding-x: 0;
  --bs-btn-padding-y: 0;
  width: 2.75rem;
  height: 2.75rem;
}

.scn-host .btn.scn-round.is-on {
  --bs-btn-color: #000;
  --bs-btn-bg: var(--scn-paper);
  --bs-btn-hover-color: #000;
  --bs-btn-hover-bg: #e8e8ee;
}

.scn-icon {
  flex: none;
  width: 1.125rem;
  height: 1.125rem;
}

/* Penanda "Otomatis": cincin kosong = mati, titik spektral = menyala */
.scn-dot {
  flex: none;
  width: 0.5rem;
  height: 0.5rem;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  border-radius: 50%;
}

.is-on > .scn-dot {
  border: 0;
  background: linear-gradient(135deg, var(--scn-mint), var(--scn-blue) 55%, var(--scn-violet));
  box-shadow: 0 0 0.6rem rgba(62, 139, 255, 0.95);
}

/* --------------------------------------------------------------------------
   Hasil & atur sudut (keduanya: area gambar + panel)
   -------------------------------------------------------------------------- */
.scn-split {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.scn-view {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 1.25rem 1rem;
}

.scn-sheet {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  border-radius: 2px;
  background: #fff;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 1.5rem 3.5rem -1rem rgba(0, 0, 0, 0.9);
  transition: opacity 0.2s ease;
}

.scn-sheet.is-busy {
  opacity: 0.45;
}

.scn-editor {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 1rem;
  overflow: hidden;
}

.scn-panel {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 0.25rem max(1.25rem, var(--scn-safe-r)) calc(1.25rem + var(--scn-safe-b)) max(1.25rem, var(--scn-safe-l));
}

.scn-host .scn-segment {
  display: flex;
  width: 100%;
  padding: 0.25rem;
  border: 1px solid var(--scn-line);
  border-radius: 999px;
  background: var(--scn-glass);
}

.scn-host .scn-segment > .btn {
  --bs-btn-color: var(--scn-mist);
  --bs-btn-bg: transparent;
  --bs-btn-border-color: transparent;
  --bs-btn-hover-color: var(--scn-paper);
  --bs-btn-hover-bg: transparent;
  --bs-btn-hover-border-color: transparent;
  --bs-btn-active-color: #000;
  --bs-btn-active-bg: var(--scn-paper);
  --bs-btn-active-border-color: var(--scn-paper);
  --bs-btn-padding-x: 0.5rem;
  --bs-btn-padding-y: 0.5rem;
  --bs-btn-font-size: 0.875rem;
  --bs-btn-font-weight: 500;
  flex: 1 1 0;
  margin: 0;
  border-radius: 999px !important;
  white-space: nowrap;
}

.scn-toast {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: calc(7rem + var(--scn-safe-b));
  transform: translateX(-50%);
  padding: 0.55rem 1.1rem;
  border-radius: 999px;
  background: var(--scn-paper);
  color: #000;
  font-size: 0.875rem;
  font-weight: 500;
  box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.5);
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   Tablet & desktop
   -------------------------------------------------------------------------- */
@media (min-width: 768px) {
  .scn-bar {
    min-height: 4rem;
    padding-left: max(1.75rem, var(--scn-safe-l));
    padding-right: max(1.75rem, var(--scn-safe-r));
  }

  .scn-title {
    font-size: 1.125rem;
  }

  .scn-camera .scn-stage {
    margin: 0 1.5rem;
    border-radius: 1.75rem;
  }

  .scn-controls {
    width: min(100%, 34rem);
    margin: 0 auto;
    padding-top: 1.5rem;
    padding-bottom: calc(1.75rem + var(--scn-safe-b));
  }

  .scn-view {
    padding: 1rem 2rem 1.5rem;
  }

  .scn-panel {
    width: min(100%, 30rem);
    margin: 0 auto;
  }
}

@media (min-width: 992px) {
  .scn-split {
    flex-direction: row;
    width: min(100%, 72rem);
    margin: 0 auto;
  }

  .scn-view {
    padding: 1.5rem 1rem 2.5rem 2.5rem;
  }

  .scn-panel {
    width: 22rem;
    margin: 0;
    justify-content: center;
    padding: 1.5rem max(2.5rem, var(--scn-safe-r)) 2.5rem 1.5rem;
  }
}

/* --------------------------------------------------------------------------
   Ponsel miring (layar pendek): kontrol pindah ke sisi kanan
   -------------------------------------------------------------------------- */
@media (orientation: landscape) and (max-height: 540px) {
  .scn-bar {
    min-height: 2.75rem;
    padding-top: calc(0.25rem + var(--scn-safe-t));
    padding-bottom: 0.25rem;
  }

  .scn-title {
    font-size: 1rem;
  }

  .scn-camera {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr);
  }

  .scn-camera > .scn-bar {
    grid-column: 1 / -1;
  }

  .scn-camera .scn-stage {
    grid-column: 1;
    grid-row: 2;
    margin: 0 0 0.75rem max(0.75rem, var(--scn-safe-l));
    border-radius: 1rem;
  }

  .scn-camera .scn-controls {
    grid-column: 2;
    grid-row: 2;
    grid-template-columns: auto;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
    gap: 0.75rem;
    width: auto;
    margin: 0;
    padding: 0 max(1rem, var(--scn-safe-r)) calc(0.75rem + var(--scn-safe-b)) 1rem;
  }

  .scn-camera .scn-side,
  .scn-camera .scn-side--end {
    justify-content: center;
  }

  .scn-split {
    flex-direction: row;
  }

  .scn-view {
    padding: 0.25rem 0.75rem 0.75rem max(0.75rem, var(--scn-safe-l));
  }

  .scn-panel {
    width: 17.5rem;
    margin: 0;
    justify-content: center;
    padding: 0.25rem max(1rem, var(--scn-safe-r)) calc(0.75rem + var(--scn-safe-b)) 0.5rem;
  }

  .scn-host .scn-segment > .btn {
    --bs-btn-font-size: 0.8125rem;
  }

  .scn-toast {
    bottom: calc(1.25rem + var(--scn-safe-b));
  }
}

@media (prefers-reduced-motion: reduce) {
  .scn-shutter,
  .scn-sheet {
    transition: none;
  }
}
</style>

<main class="scn-host" data-bs-theme="dark">
  <!-- ==========================================================
       LAYAR 1 · KAMERA
       Cahaya scan digambar JS di atas video: kanvas .scn-layer
       disisipkan ke #scnStage, bukan ditulis di markup ini.
       ========================================================== -->
  <section class="scn-screen scn-camera" *ngIf="screen === 'camera'">
    <header class="scn-bar">
      <h1 class="scn-title">{{ copy.cameraTitle }}</h1>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn scn-glass scn-round" *ngIf="torchAvailable" [ngClass]="{ 'is-on': torchOn }" [attr.aria-pressed]="torchOn" [attr.aria-label]="labels.torch" (click)="toggleTorch()">
          <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z" /></svg>
        </button>
        <button type="button" class="btn scn-glass scn-round" *ngIf="hasManyCameras" [disabled]="isBusy" [attr.aria-label]="labels.switchCamera" (click)="switchCamera()">
          <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5A8 8 0 0 1 18.5 6" /><path d="M19 2.5V6.5H15" /><path d="M20 14.5A8 8 0 0 1 5.5 18" /><path d="M5 21.5V17.5H9" /></svg>
        </button>
      </div>
    </header>

    <div class="scn-stage" id="scnStage">
      <video id="scnVideo" class="scn-video" autoplay playsinline muted></video>

      <p class="scn-hint" role="status" aria-live="polite" *ngIf="cameraState !== 'error'">{{ hint }}</p>

      <div class="scn-state" *ngIf="cameraState === 'error'">
        <p>{{ cameraMessage }}</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <button type="button" class="btn scn-solid" (click)="retryCamera()">{{ labels.tryAgain }}</button>
          <label class="btn scn-glass scn-lg mb-0">
            <input type="file" accept="image/*" class="d-none" (change)="onUpload($event)" />
            {{ labels.upload }}
          </label>
        </div>
      </div>
    </div>

    <footer class="scn-controls">
      <div class="scn-side">
        <!-- Hanya muncul dengan query ?IsUpload, sama seperti halaman Gemini. -->
        <label class="btn scn-glass mb-0" *ngIf="isEnableUpload && cameraState !== 'error'">
          <input type="file" accept="image/*" class="d-none" (change)="onUpload($event)" />
          <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4" /><path d="m7 9 5-5 5 5" /><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" /></svg>
          <span>{{ labels.upload }}</span>
        </label>
      </div>

      <button type="button" class="scn-shutter" [disabled]="cameraState !== 'ready' || isBusy" [attr.aria-label]="labels.shutter" (click)="capture()"><span></span></button>

      <div class="scn-side scn-side--end">
        <button type="button" class="btn scn-glass" *ngIf="cameraState !== 'error'" [ngClass]="{ 'is-on': autoCapture }" [attr.aria-pressed]="autoCapture" (click)="toggleAuto()">
          <span class="scn-dot"></span>{{ labels.auto }}
        </button>
      </div>
    </footer>
  </section>

  <!-- ==========================================================
       LAYAR 2 · HASIL
       Gambarnya membatasi diri sendiri (max-width / max-height),
       jadi kertas rasio apa pun tampil pas tanpa pita kosong.
       ========================================================== -->
  <section class="scn-screen scn-result" *ngIf="screen === 'result'">
    <header class="scn-bar">
      <h1 class="scn-title">{{ copy.resultTitle }}</h1>
    </header>

    <div class="scn-split">
      <div class="scn-view">
        <img id="scnResultImg" class="scn-sheet" *ngIf="resultUrl" [ngClass]="{ 'invisible': revealing, 'is-busy': isBusy && !revealing }" [src]="resultUrl" alt="Hasil scan" />
      </div>

      <div class="scn-panel">
        <div class="btn-group scn-segment" role="group" [attr.aria-label]="labels.filterGroup">
          <button type="button" class="btn" *ngFor="let item of filters" [ngClass]="{ 'active': filter === item.key }" [attr.aria-pressed]="filter === item.key" (click)="setFilter(item.key)">{{ item.label }}</button>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn scn-glass flex-fill" [disabled]="isBusy" (click)="rotate()">
            <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20 4v5h-5" /></svg>
            {{ labels.rotate }}
          </button>
          <button type="button" class="btn scn-glass flex-fill" *ngIf="canAdjust" [disabled]="isBusy" (click)="openAdjust()">
            <svg class="scn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4" /><path d="M15 4h4a1 1 0 0 1 1 1v4" /><path d="M20 15v4a1 1 0 0 1-1 1h-4" /><path d="M9 20H5a1 1 0 0 1-1-1v-4" /></svg>
            {{ labels.adjust }}
          </button>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn scn-glass scn-lg flex-fill" (click)="rescan()">{{ labels.rescan }}</button>
          <button type="button" class="btn scn-solid flex-fill" [disabled]="isBusy || !resultUrl" (click)="save()">{{ labels.save }}</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==========================================================
       LAYAR 3 · ATUR SUDUT
       Editor sudut (titik geser + kaca pembesar) dibuat scanic ke
       dalam #scnEditor sesudah layar ini tampil.
       ========================================================== -->
  <section class="scn-screen scn-adjust" *ngIf="screen === 'adjust'">
    <header class="scn-bar flex-column align-items-start justify-content-center gap-1">
      <h1 class="scn-title">{{ copy.adjustTitle }}</h1>
      <p class="scn-sub">{{ copy.adjustHint }}</p>
    </header>

    <div class="scn-split">
      <div class="scn-view">
        <div class="scn-editor" id="scnEditor"></div>
      </div>

      <div class="scn-panel">
        <div class="d-flex gap-2">
          <button type="button" class="btn scn-glass scn-lg flex-fill" (click)="cancelAdjust()">{{ labels.cancel }}</button>
          <button type="button" class="btn scn-solid flex-fill" (click)="applyAdjust()">{{ labels.apply }}</button>
        </div>
      </div>
    </div>
  </section>

  <div class="scn-toast" role="status" *ngIf="toast">{{ toast }}</div>
</main>

<script>
/* =========================================================================
   INTERFACE SCANNER — skrip halaman

   Alur layar:  camera -> result   (result -> adjust -> result)

   Deteksi kertas memakai scanic (MIT), dimuat saat halaman dibuka lewat
   import() dari jsDelivr, jadi tidak perlu build atau berkas tambahan.
   Detektor utamanya ML (DocCornerNet, sekitar 2 MB, dimuat sekali). Kalau
   gagal dimuat, otomatis turun ke detektor klasik; kalau scanic sendiri
   gagal dimuat, halaman tetap jalan sebagai kamera biasa.

   Perspektif diluruskan oleh kode di berkas ini sendiri (homografi +
   bilinear), termasuk tebakan rasio asli kertas dari sudut pandang kamera
   (Zhang & He, 2007), sehingga hasilnya tidak gepeng walau difoto miring.

   Aturan platform yang diikuti (sama dengan template Gemini):
   - persis satu blok gaya, satu main, satu blok skrip;
   - nama kedua tag itu tidak pernah ditulis utuh di komentar;

     kanvas lewat requestAnimationFrame, transisi besar memakai Web

   ========================================================================= */
this.pageMain = async () => {
  //#region KONFIGURASI  <<< YANG BIASANYA DIUBAH ADA DI SINI

  /* Opsi detektor ML. Tambahkan assetBaseUrl kalau model + runtime-nya

  /* Rasio kertas, lebar / tinggi.
       "auto"   -> ditebak dari foto (kertas ukuran apa saja)
       210/297  -> A4      148/210 -> A5      4/6 -> kartu 4R
     Kalau diisi angka, orientasinya (tegak / rebah) tetap mengikuti kertas
     di foto. Isi angka kalau kertasnya dicetak sendiri — hasilnya paling

  const DOC_RATIO = "auto";

  /* Jepret otomatis: kertas harus diam selama HOLD_MS. */

  /* Hasil */
  const OUTPUT_MAX = 2400; // sisi terpanjang gambar hasil (px)

  const DEFAULT_FILTER = "clean"; // original | clean | bw

  /* Dipanggil setiap kali hasil scan siap atau berubah (ganti filter, putar,

  this.copy = {
    cameraTitle: "Scan dokumen",
    resultTitle: "Hasil scan",
    adjustTitle: "Atur sudut",
    adjustHint: "Geser titik di tiap sudut sampai pas dengan tepi kertas.",
    hintLoading: "Menyiapkan kamera…",
    hintSearch: "Arahkan kamera ke kertas",
    hintCloser: "Dekatkan kamera ke kertas",
    hintHold: "Tahan posisi sebentar",
    hintTap: "Tekan tombol untuk memotret",
    hintWorking: "Merapikan hasil scan…",
    saved: "Tersimpan",
    errInsecure: "Kamera hanya bisa dibuka lewat https.",

  this.labels = {
    shutter: "Ambil foto",
    auto: "Otomatis",
    upload: "Unggah foto",
    torch: "Lampu kilat",
    switchCamera: "Ganti kamera",
    tryAgain: "Coba lagi",

    rotate: "Putar",
    adjust: "Atur sudut",
